    Zmieniaj numerację elementów w kolejności wyboru w jednym pływającym panelu. Kategorie odpowiadają oryginalnemu ReNumber i aktywnemu widokowi.

    SPOSÓB UŻYCIA
    1. Wybierz kategorię, wartość początkową, Increase/Decrease i krok (1, 2, 0.2 lub 0.3).
    2. Oddziel wykluczenia przecinkami: 5, 8-10, A to C, #. Puste pole oznacza brak wykluczeń.
    3. Wybierz obsługę duplikatów, kliknij Start picking i wybieraj w kolejności. Esc w Revit kończy wybieranie.

    OPCJE I DZIAŁANIE
    - Skip przesuwa wartość o jeden ustawiony krok bez zmiany elementu.
    - Przyjmuje liczby, litery i symbole; zakresy obejmują oba końce. Podwójny cudzysłów wymusza dokładne dopasowanie tekstu.
    - Kroki dziesiętne i zmniejszanie dotyczą liczb; identyfikatory literowe używają Increase z krokiem 1.
    - Number doors by room pojawia się tylko dla drzwi. Numery pozostają powiązane z pomieszczeniami; pominięte lub wykluczone drzwi nie zmieniają się.
    - Sweep przenosi kolidujący element na wolny numer. Alert ostrzega i pozostawia wybrany element. Skip przy konflikcie pozostawia już ponumerowany wybrany element.

    POMOC
    ? wyświetla instrukcje i łącza GitHub/LinkedIn. ★ GitHub otwiera repozytorium NdevTools.

    BEZPIECZEŃSTWO
    Zmiana numeracji modyfikuje istniejące wartości. Sweep może też zmieniać numery elementów powodujących konflikt; sprawdź opcje przed wyborem.


tooltip:
  ar: |-
    NDEV TOOLS | RENUMBER

    أعد ترقيم العناصر بترتيب اختيارها من لوحة عائمة واحدة. تتبع الفئات قواعد ReNumber الأصلية والعرض النشط.

    طريقة الاستخدام
    1. اختر الفئة وقيمة البداية وIncrease/Decrease والخطوة (1 أو 2 أو 0.2 أو 0.3).
    2. أدخل الاستثناءات مفصولة بفواصل: 5, 8-10, A to C, #. اترك الحقل فارغًا لعدم الاستبعاد.
    3. اختر معالجة التكرار وانقر Start picking وحدد العناصر بالترتيب. اضغط Esc داخل Revit للإنهاء.

    الخيارات والسلوك
    - يتقدم Skip خطوة محددة دون تعديل أي عنصر.
    - تُقبل الأرقام والحروف والرموز الخاصة؛ تشمل النطاقات طرفيها. استخدم علامتي اقتباس مزدوجتين للمطابقة الحرفية.
    - الخطوات العشرية والتناقص للأرقام؛ تستخدم المعرّفات الحرفية Increase بخطوة 1.
    - يظهر Number doors by room للأبواب فقط. تبقى أرقامها مرتبطة بالغرف وتظل الأبواب المتخطاة أو المستبعدة دون تغيير.
    - ينقل Sweep العنصر المتعارض إلى رقم متاح. يحذر Alert ويترك العنصر المختار. يترك Skip العنصر المختار المرقم دون تغيير عند التعارض.

    المساعدة
    يعرض ? التعليمات وروابط GitHub وLinkedIn. يفتح ★ GitHub مستودع NdevTools.

    الأمان
    تعيد الأداة كتابة القيم الحالية. قد يعيد Sweep ترقيم العناصر المتعارضة أيضًا؛ راجع الخيارات قبل الاختيار.

    التوافق
    pyRevit | IronPython 2.7

    إعداد Nataraj Devaraj.
  pt_br: |-
    NDEV TOOLS | RENUMBER

    Renumere elementos na ordem de seleção em um único painel flutuante. As categorias seguem o ReNumber original e a vista ativa.

    COMO USAR
    1. Escolha categoria, valor inicial, Increase/Decrease e passo (1, 2, 0.2 ou 0.3).
    2. Separe as exclusões por vírgulas: 5, 8-10, A to C, #. Deixe em branco para nenhuma.
    3. Escolha o tratamento de duplicados, clique em Start picking e selecione em ordem. Pressione Esc no Revit para concluir.

    OPÇÕES E COMPORTAMENTO
    - Skip avança um passo configurado sem alterar elementos.
    - Aceita números, letras e símbolos; os intervalos incluem as extremidades. Use aspas duplas para correspondência literal.
    - Passos decimais e redução aplicam-se a números; identificadores com letras usam Increase com passo 1.
    - Number doors by room aparece apenas para portas. Os números seguem os ambientes; portas ignoradas ou excluídas não mudam.
    - Sweep move o elemento em conflito para um número livre. Alert avisa e mantém o selecionado. Skip mantém o selecionado já numerado quando há conflito.

    AJUDA
    ? mostra instruções e links GitHub/LinkedIn. ★ GitHub abre o repositório NdevTools.

    SEGURANÇA
    A renumeração altera valores existentes. Sweep também pode renumerar elementos em conflito; confira as opções antes de selecionar.

    COMPATIBILIDADE
    pyRevit | IronPython 2.7

    Criado por Nataraj Devaraj.
  bg: |-
    NDEV TOOLS | RENUMBER

    Преномерирайте елементите по реда на избиране в един плаващ панел. Категориите следват оригиналния ReNumber и активния изглед.

    НАЧИН НА ИЗПОЛЗВАНЕ
    1. Изберете категория, начална стойност, Increase/Decrease и стъпка (1, 2, 0.2 или 0.3).
    2. Разделете изключенията със запетаи: 5, 8-10, A to C, #. Празно поле означава без изключения.
    3. Изберете обработка на дубликати, натиснете Start picking и избирайте по ред. Esc в Revit завършва избора.

    ОПЦИИ И ПОВЕДЕНИЕ
    - Skip придвижва една зададена стъпка, без да променя елемент.
    - Приемат се числа, букви и символи; диапазоните включват двата края. Двойните кавички задават точно текстово съвпадение.
    - Десетични стъпки и намаляване са за числа; буквени идентификатори използват Increase със стъпка 1.
    - Number doors by room се показва само за врати. Номерата следват стаите; пропуснатите или изключените врати не се променят.
    - Sweep премества конфликтния елемент към свободен номер. Alert предупреждава и запазва избрания. Skip запазва вече номерирания избран елемент при конфликт.

    ПОМОЩ
    ? показва инструкции и връзки GitHub/LinkedIn. ★ GitHub отваря хранилището NdevTools.

    БЕЗОПАСНОСТ
    Преномерирането променя съществуващи стойности. Sweep може да преномерира и конфликтни елементи; проверете опциите преди избор.

    СЪВМЕСТИМОСТ
    pyRevit | IronPython 2.7

    Създадено от Nataraj Devaraj.
  chinese_s: |-
    NDEV TOOLS | RENUMBER

    在一个浮动属性面板中按选择顺序重新编号。类别遵循原版 ReNumber 的规则及当前视图。

    使用方法
    1. 选择类别、起始值、Increase/Decrease 和步长（1、2、0.2 或 0.3）。
    2. 用逗号分隔排除项：5, 8-10, A to C, #。留空表示不排除。
    3. 选择重复编号处理方式，单击 Start picking 并按顺序选择图元。在 Revit 中按 Esc 结束。

    选项与行为
    - Skip 前进一个设定步长，不修改任何图元。
    - 排除项支持数字、字母和特殊字符；范围包含两端。用双引号包围条目可按原文精确匹配。
    - 小数步长及递减适用于数字；含字母的标识符使用 Increase，步长为 1。
    - Number doors by room 仅对门显示。编号保持与房间关联；跳过或排除的门保持不变。
    - Sweep 将冲突图元移至可用编号。Alert 提示并保留所选图元。Skip 在冲突时保留已有编号的所选图元。

    帮助
    ? 显示说明及 GitHub/LinkedIn 链接。★ GitHub 打开 NdevTools 仓库。

    安全
    重新编号会更改现有值。Sweep 还可能重新编号冲突元素；选择前请检查选项。

    兼容性
    pyRevit | IronPython 2.7

    作者：Nataraj Devaraj。
  chinese_t: |-
    NDEV TOOLS | RENUMBER

    在單一浮動屬性面板中依選取順序重新編號。類別遵循原版 ReNumber 的規則及目前視圖。

    使用方法
    1. 選擇類別、起始值、Increase/Decrease 和步長（1、2、0.2 或 0.3）。
    2. 以逗號分隔排除項目：5, 8-10, A to C, #。留白表示不排除。
    3. 選擇重複編號處理方式，按 Start picking 並依序選取元素。在 Revit 中按 Esc 結束。

    選項與行為
    - Skip 前進一個設定步長，不修改任何元素。
    - 排除項目支援數字、字母和特殊字元；範圍包含兩端。以雙引號包住項目可依原文精確比對。
    - 小數步長及遞減適用於數字；含字母的識別碼使用 Increase，步長為 1。
    - Number doors by room 僅對門顯示。編號維持與房間關聯；跳過或排除的門保持不變。
    - Sweep 將衝突元素移至可用編號。Alert 提示並保留所選元素。Skip 在衝突時保留已有編號的所選元素。

    說明
    ? 顯示操作說明及 GitHub/LinkedIn 連結。★ GitHub 開啟 NdevTools 儲存庫。

    安全
    重新編號會變更現有值。Sweep 也可能重新編號衝突元素；選取前請確認選項。

    相容性
    pyRevit | IronPython 2.7

    作者：Nataraj Devaraj。
  cs: |-
    NDEV TOOLS | RENUMBER

    Přečíslujte prvky v pořadí výběru v jediném plovoucím panelu. Kategorie odpovídají původnímu ReNumber a aktivnímu pohledu.

    POSTUP
    1. Vyberte kategorii, počáteční hodnotu, Increase/Decrease a krok (1, 2, 0.2 nebo 0.3).
    2. Vyloučení oddělte čárkami: 5, 8-10, A to C, #. Prázdné pole znamená žádná vyloučení.
    3. Zvolte zpracování duplicit, klikněte na Start picking a vybírejte v pořadí. Esc v Revitu ukončí výběr.

    MOŽNOSTI A CHOVÁNÍ
    - Skip posune hodnotu o jeden nastavený krok bez změny prvku.
    - Přijímá čísla, písmena a symboly; rozsahy zahrnují oba konce. Dvojité uvozovky vynutí přesnou textovou shodu.
    - Desetinné kroky a snižování platí pro čísla; písmenné identifikátory používají Increase s krokem 1.
    - Number doors by room se zobrazí pouze pro dveře. Čísla zůstávají navázaná na místnosti; přeskočené či vyloučené dveře se nemění.
    - Sweep přesune kolidující prvek na volné číslo. Alert upozorní a ponechá vybraný prvek. Skip při kolizi ponechá již očíslovaný vybraný prvek.

    NÁPOVĚDA
    ? zobrazí pokyny a odkazy GitHub/LinkedIn. ★ GitHub otevře repozitář NdevTools.

    BEZPEČNOST
    Přečíslování mění existující hodnoty. Sweep může přečíslovat také kolidující prvky; před výběrem zkontrolujte možnosti.

    KOMPATIBILITA
    pyRevit | IronPython 2.7

    Vytvořil Nataraj Devaraj.
  nl_nl: |-
    NDEV TOOLS | RENUMBER

    Hernummer elementen in selectievolgorde vanuit één zwevend eigenschappenpaneel. Categorieën volgen het oorspronkelijke ReNumber en het actieve aanzicht.

    GEBRUIK
    1. Kies categorie, beginwaarde, Increase/Decrease en stap (1, 2, 0.2 of 0.3).
    2. Scheid uitsluitingen met komma's: 5, 8-10, A to C, #. Laat leeg voor geen uitsluitingen.
    3. Kies de afhandeling van duplicaten, klik op Start picking en selecteer op volgorde. Esc in Revit beëindigt de selectie.

    OPTIES EN GEDRAG
    - Skip gaat één ingestelde stap verder zonder een element te wijzigen.
    - Accepteert cijfers, letters en symbolen; bereiken omvatten beide grenzen. Dubbele aanhalingstekens geven een exacte tekstmatch.
    - Decimale stappen en afnemen gelden voor getallen; letteridentificaties gebruiken Increase met stap 1.
    - Number doors by room verschijnt alleen bij deuren. Nummers blijven gekoppeld aan ruimten; overgeslagen of uitgesloten deuren veranderen niet.
    - Sweep verplaatst het conflicterende element naar een vrij nummer. Alert waarschuwt en behoudt het geselecteerde. Skip behoudt bij een conflict het al genummerde geselecteerde element.

    HELP
    ? toont instructies en GitHub/LinkedIn-links. ★ GitHub opent de NdevTools-repository.

    VEILIGHEID
    Hernummeren wijzigt bestaande waarden. Sweep kan ook conflicterende elementen hernummeren; controleer de opties voor het selecteren.

    COMPATIBILITEIT
    pyRevit | IronPython 2.7

    Gemaakt door Nataraj Devaraj.
  en_gb: |-
    NDEV TOOLS | RENUMBER

    Renumber elements in selection order from one floating properties panel. Categories follow the original ReNumber rules and the active view.

    HOW TO USE
    1. Choose a category, starting value, Increase/Decrease and step (1, 2, 0.2 or 0.3).
    2. Enter comma-separated exclusions: 5, 8-10, A to C, #. Leave blank for none.
    3. Choose duplicate handling, click Start picking and select elements in order. Press Esc in Revit to finish.

    OPTIONS & BEHAVIOUR
    - Skip advances one configured step without changing an element.
    - Exclusions accept numbers, letters and special characters; ranges include both endpoints. Double-quote entries for literal matching.
    - Decimal steps and decreasing sequences apply to numbers; letter-based identifiers use Increase by 1.
    - Number doors by room appears only for Doors. Numbers stay tied to rooms; skipped or excluded doors remain unchanged.
    - Sweep moves a conflicting element to a free number. Alert warns and leaves the selected element unchanged. Skip leaves an already numbered selected element unchanged when there is a conflict.

    HELP
    ? shows instructions and GitHub/LinkedIn links. ★ GitHub opens the NdevTools repository.

    SAFETY
    Renumbering changes existing values. Sweep can also renumber conflicting elements; check the selected options before picking.

    COMPATIBILITY
    pyRevit | IronPython 2.7

    Created by Nataraj Devaraj.

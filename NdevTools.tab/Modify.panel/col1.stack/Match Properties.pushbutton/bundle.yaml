tooltip:
  ar: |-
    NDEV TOOLS | MATCH PROPERTIES

    طابق الأنواع والخصائص المتوافقة القابلة للتعديل لعناصر النموذج ونصوص الملاحظات والوسوم والأبعاد والتعليقات الأخرى الأصلية في Revit.

    طريقة الاستخدام
    1. انقر Start matching واختر العنصر المصدر.
    2. حدد الخصائص ونوع العنصر اختياريًا، ثم اختر أهدافًا متوافقة وانقر Finish.
    3. راجع التقرير واستخدم Copy Report لنسخ النتائج.

    في أعلى النافذة، يفتح Help طريقة الاستخدام ويفتح زر ★ GitHub المجاور مستودع NdevTools.

    الخيارات والسلوك
    يدعم النص النوع والمحاذاة وعرض النص الملتف؛ وتدعم الوسوم النوع والقادة والاتجاه حيث يمكن تعديلها.

    الأمان
    يُحفظ محتوى النص والعناصر المضيفة للوسوم. تُبلّغ العناصر للقراءة فقط أو المثبتة أو المجمعة أو غير المتوافقة؛ وتُلغى تغييرات الهدف المرفوضة.

    التوافق
    pyRevit | IronPython 2.7

    إعداد Nataraj Devaraj.
  pt_br: |-
    NDEV TOOLS | MATCH PROPERTIES

    Iguale tipos e propriedades editáveis compatíveis de elementos nativos de modelo, notas de texto, identificadores, cotas e outras anotações.

    COMO USAR
    1. Clique em Start matching e selecione o elemento de origem.
    2. Marque as propriedades e, opcionalmente, o tipo; selecione destinos compatíveis e clique em Finish.
    3. Confira o relatório; use Copy Report para copiar os resultados.

    No topo da janela, Help abre as instruções. O botão ★ GitHub ao lado abre o repositório NdevTools.

    OPÇÕES E COMPORTAMENTO
    Textos permitem tipo, alinhamento e largura com quebra de linha; identificadores permitem tipo, chamadas e orientação quando editáveis.

    SEGURANÇA
    O conteúdo do texto e os hospedeiros dos identificadores são mantidos. Restrições de edição, fixação, grupos ou incompatibilidade são relatadas; alterações rejeitadas são revertidas.

    COMPATIBILIDADE
    pyRevit | IronPython 2.7

    Criado por Nataraj Devaraj.
  bg: |-
    NDEV TOOLS | MATCH PROPERTIES

    Съпоставяйте типове и съвместими редактируеми свойства на моделни елементи, текстови бележки, етикети, размери и други собствени анотации.

    НАЧИН НА ИЗПОЛЗВАНЕ
    1. Натиснете Start matching и изберете изходния елемент.
    2. Отметнете свойствата и по избор типа, изберете съвместими цели и натиснете Finish.
    3. Прегледайте отчета; Copy Report копира резултатите.

    В горната част на прозореца Help отваря указанията, а съседният бутон ★ GitHub отваря хранилището на NdevTools.

    ОПЦИИ И ПОВЕДЕНИЕ
    Текстът поддържа тип, подравняване и ширина при пренасяне; етикетите поддържат тип, водещи линии и ориентация, когато са редактируеми.

    БЕЗОПАСНОСТ
    Текстовото съдържание и означените елементи се запазват. Ограниченията за редактиране, закрепването, групите и несъвместимостта се отчитат; отхвърлените промени се отменят.

    СЪВМЕСТИМОСТ
    pyRevit | IronPython 2.7

    Създадено от Nataraj Devaraj.
  chinese_s: |-
    NDEV TOOLS | MATCH PROPERTIES

    匹配原生模型元素、文字注释、标记、尺寸及其他注释的类型和兼容的可编辑属性。

    使用方法
    1. 点击 Start matching，选择源元素。
    2. 勾选属性及可选的元素类型，选择兼容目标，然后点击 Finish。
    3. 查看报告；使用 Copy Report 复制结果。

    窗口顶部的 Help 可打开使用说明，旁边的 ★ GitHub 可打开 NdevTools 代码仓库。

    选项与行为
    文字支持类型、对齐和换行宽度；标记支持可编辑的类型、引线及方向。

    安全
    保留文字内容和标记关联的主体。只读、固定、成组或不兼容的目标会在报告中说明；被拒绝的目标更改将回滚。

    兼容性
    pyRevit | IronPython 2.7

    作者：Nataraj Devaraj。
  chinese_t: |-
    NDEV TOOLS | MATCH PROPERTIES

    比對原生模型元素、文字註解、標籤、尺寸及其他註解的類型與相容的可編輯屬性。

    使用方法
    1. 按 Start matching 並選取來源元素。
    2. 勾選屬性及選用的元素類型，選取相容目標，然後按 Finish。
    3. 檢視報告；使用 Copy Report 複製結果。

    視窗頂端的 Help 可開啟使用說明，旁邊的 ★ GitHub 可開啟 NdevTools 程式碼儲存庫。

    選項與行為
    文字支援類型、對齊及換行寬度；標籤支援可編輯的類型、引線及方向。

    安全
    保留文字內容與標籤關聯的主體。唯讀、釘住、成組或不相容的目標會在報告中說明；遭拒絕的目標變更將回復。

    相容性
    pyRevit | IronPython 2.7

    作者：Nataraj Devaraj。
  cs: |-
    NDEV TOOLS | MATCH PROPERTIES

    Přeneste typy a kompatibilní upravitelné vlastnosti nativních modelových prvků, textových poznámek, popisků, kót a dalších anotací.

    JAK POUŽÍVAT
    1. Klikněte na Start matching a vyberte zdrojový prvek.
    2. Zaškrtněte vlastnosti a případně typ, vyberte kompatibilní cíle a klikněte na Finish.
    3. Zkontrolujte výkaz; Copy Report zkopíruje výsledky.

    V horní části okna otevřete návod tlačítkem Help. Sousední tlačítko ★ GitHub otevře repozitář NdevTools.

    MOŽNOSTI A CHOVÁNÍ
    Text podporuje typ, zarovnání a šířku při zalamování; popisky podporují upravitelný typ, odkazové čáry a orientaci.

    BEZPEČNOST
    Textový obsah a označené prvky se zachovají. Omezení úprav, připnutí, skupiny a nekompatibilita se uvedou ve výkazu; odmítnuté změny se vrátí zpět.

    KOMPATIBILITA
    pyRevit | IronPython 2.7

    Vytvořil Nataraj Devaraj.
  nl_nl: |-
    NDEV TOOLS | MATCH PROPERTIES

    Kopieer typen en compatibele bewerkbare eigenschappen van modelelementen, tekstnotities, labels, maatlijnen en andere oorspronkelijke Revit-annotaties.

    GEBRUIK
    1. Klik op Start matching en kies het bronelement.
    2. Vink eigenschappen en eventueel het type aan, kies compatibele doelen en klik op Finish.
    3. Controleer het rapport; gebruik Copy Report om resultaten te kopiëren.

    Bovenaan opent Help de instructies. Met ★ GitHub ernaast opent u de NdevTools-repository.

    OPTIES EN GEDRAG
    Tekst ondersteunt type, uitlijning en omloopbreedte; labels ondersteunen type, verwijslijnen en oriëntatie waar bewerkbaar.

    VEILIGHEID
    Tekstinhoud en gelabelde elementen blijven behouden. Alleen-lezen, vastgezette, gegroepeerde of onverenigbare doelen worden gemeld; geweigerde wijzigingen worden teruggedraaid.

    COMPATIBILITEIT
    pyRevit | IronPython 2.7

    Gemaakt door Nataraj Devaraj.
  en_gb: |-
    NDEV TOOLS | MATCH PROPERTIES

    Match types and compatible editable properties of native model elements, text notes, tags, dimensions and other annotations.

    HOW TO USE
    1. Click Start matching and pick the source element.
    2. Check the properties and optional element type, then select compatible targets and click Finish.
    3. Review the report; use Copy Report to copy the results.

    In the header, Help opens the matching instructions. The ★ GitHub button beside it opens the NdevTools repository.

    OPTIONS & BEHAVIOR
    Text supports type, alignment and wrapped width; tags support type, leaders and orientation where writable.

    SAFETY
    Text wording and tag hosts are retained. Read-only, pinned, grouped or incompatible targets are reported; rejected target changes roll back.

    COMPATIBILITY
    pyRevit | IronPython 2.7

    Created by Nataraj Devaraj.

  ru: |-
    NDEV TOOLS | MATCH PROPERTIES

    Сопоставляйте типы и совместимые редактируемые свойства собственных элементов модели, текстовых примечаний, марок, размеров и других аннотаций.

    КАК ИСПОЛЬЗОВАТЬ
    1. Нажмите Start matching и выберите исходный элемент.
    2. Отметьте свойства и при необходимости тип, выберите совместимые цели и нажмите Finish.

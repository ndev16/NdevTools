    Вверху окна кнопка Help открывает инструкцию, а соседняя кнопка ★ GitHub — репозиторий NdevTools.

    ПАРАМЕТРЫ И ПОВЕДЕНИЕ
    Текст поддерживает тип, выравнивание и ширину переноса; марки поддерживают редактируемые тип, выноски и ориентацию.

    БЕЗОПАСНОСТЬ
    Содержимое текста и маркируемые элементы сохраняются. Ограничения чтения, закрепление, группы и несовместимость отражаются в отчёте; отклонённые изменения отменяются.

    СОВМЕСТИМОСТЬ

  fa: |-
    NDEV TOOLS | MATCH PROPERTIES

    نوع و ویژگی‌های سازگار قابل ویرایش عناصر بومی مدل، یادداشت‌های متنی، برچسب‌ها، اندازه‌ها و سایر توضیحات Revit را تطبیق دهید.

    روش استفاده
    1. Start matching را بزنید و عنصر مبدأ را انتخاب کنید.
    2. ویژگی‌ها و در صورت نیاز نوع را انتخاب کنید، مقصدهای سازگار را برگزینید و Finish را بزنید.
    3. گزارش را بررسی کنید؛ Copy Report نتایج را کپی می‌کند.

    در بالای پنجره، Help راهنمای تطبیق ویژگی‌ها را باز می‌کند. دکمهٔ ★ GitHub در کنار آن مخزن NdevTools را باز می‌کند.

    گزینه‌ها و رفتار
    متن از نوع، تراز و عرض متن شکسته پشتیبانی می‌کند؛ برچسب‌ها از نوع، خطوط راهنما و جهت قابل ویرایش پشتیبانی می‌کنند.

    ایمنی
    محتوای متن و عناصر میزبان برچسب‌ها حفظ می‌شوند. محدودیت‌های فقط‌خواندنی، پین، گروه و ناسازگاری گزارش می‌شوند و تغییرات ردشده بازگردانده می‌شوند.

    سازگاری
    pyRevit | IronPython 2.7

    ساخته‌شده توسط Nataraj Devaraj.
  fr_fr: |-
    NDEV TOOLS | MATCH PROPERTIES

    Copiez les types et propriétés modifiables compatibles des éléments de modèle natifs, notes de texte, étiquettes, cotes et autres annotations.

    UTILISATION
    1. Cliquez sur Start matching et choisissez l’élément source.
    2. Cochez les propriétés et éventuellement le type, choisissez des cibles compatibles, puis cliquez sur Finish.
    3. Consultez le rapport ; Copy Report copie les résultats.

    En haut de la fenêtre, Help ouvre le mode d’emploi. Le bouton ★ GitHub juste à côté ouvre le dépôt NdevTools.

    OPTIONS ET COMPORTEMENT
    Le texte prend en charge type, alignement et largeur avec retour à la ligne ; les étiquettes prennent en charge type, repères et orientation si modifiables.

    SÉCURITÉ
    Le contenu du texte et les hôtes des étiquettes sont conservés. Les restrictions de lecture seule, d’épinglage, de groupe ou de compatibilité sont signalées ; les modifications refusées sont annulées.

    COMPATIBILITÉ
    pyRevit | IronPython 2.7

    Créé par Nataraj Devaraj.
  de_de: |-
    NDEV TOOLS | MATCH PROPERTIES

    Übertragen Sie Typen und kompatible bearbeitbare Eigenschaften nativer Modellelemente, Textnotizen, Beschriftungen, Bemaßungen und anderer Anmerkungen.

    VERWENDUNG
    1. Klicken Sie auf Start matching und wählen Sie das Quellelement.
    2. Wählen Sie Eigenschaften und optional den Typ, wählen Sie kompatible Ziele und klicken Sie auf Finish.
    3. Prüfen Sie den Bericht; Copy Report kopiert die Ergebnisse.

    Oben im Fenster öffnet Help die Anleitung. Über ★ GitHub daneben gelangen Sie zum NdevTools-Repository.

    OPTIONEN UND VERHALTEN
    Text unterstützt Typ, Ausrichtung und Umbruchbreite; Beschriftungen unterstützen bearbeitbare Typen, Führungslinien und Ausrichtung.

    SICHERHEIT
    Textinhalt und beschriftete Elemente bleiben erhalten. Schreibgeschützte, fixierte, gruppierte oder inkompatible Ziele werden gemeldet; abgelehnte Änderungen werden zurückgerollt.

    KOMPATIBILITÄT
    pyRevit | IronPython 2.7

    Erstellt von Nataraj Devaraj.
  hu: |-
    NDEV TOOLS | MATCH PROPERTIES

    Másolja a natív modellelemek, szöveges megjegyzések, címkék, méretek és más annotációk típusát és kompatibilis szerkeszthető tulajdonságait.

    HASZNÁLAT
    1. Kattintson a Start matching gombra, és válassza ki a forráselemet.
    2. Jelölje ki a tulajdonságokat és igény szerint a típust, válasszon kompatibilis célokat, majd kattintson a Finish gombra.
    3. Ellenőrizze a jelentést; a Copy Report másolja az eredményeket.

    Az ablak tetején a Help gomb nyitja meg az útmutatót, a mellette lévő ★ GitHub pedig az NdevTools GitHub-tárhelyét.

    BEÁLLÍTÁSOK ÉS MŰKÖDÉS
    Szövegnél a típus, igazítás és sortörési szélesség; címkéknél a típus, mutatóvonal és tájolás másolható, ha szerkeszthető.

    BIZTONSÁG
    A szövegtartalom és a címkék gazdaelemei megmaradnak. Az írásvédett, rögzített, csoportosított vagy inkompatibilis célokat jelzi a jelentés; az elutasított módosítások visszaállnak.

    KOMPATIBILITÁS
    pyRevit | IronPython 2.7

    Készítette: Nataraj Devaraj.
  it_it: |-
    NDEV TOOLS | MATCH PROPERTIES

    Copia tipi e proprietà modificabili compatibili di elementi di modello nativi, note di testo, etichette, quote e altre annotazioni.

    COME USARE
    1. Premi Start matching e scegli l’elemento sorgente.
    2. Seleziona le proprietà e, facoltativamente, il tipo; scegli destinazioni compatibili e premi Finish.
    3. Controlla il report; Copy Report copia i risultati.

    In alto, Help apre le istruzioni. Il pulsante ★ GitHub accanto a Help apre il repository di NdevTools.

    OPZIONI E COMPORTAMENTO
    Il testo supporta tipo, allineamento e larghezza a capo; le etichette supportano tipo, direttrici e orientamento quando modificabili.

    SICUREZZA
    Il contenuto del testo e gli elementi etichettati vengono conservati. Destinazioni di sola lettura, bloccate, raggruppate o incompatibili vengono segnalate; le modifiche rifiutate vengono annullate.

    COMPATIBILITÀ
    pyRevit | IronPython 2.7

    Creato da Nataraj Devaraj.
  ja: |-
    NDEV TOOLS | MATCH PROPERTIES

    Revit のネイティブなモデル要素、文字注記、タグ、寸法、その他の注釈のタイプと互換性のある編集可能なプロパティをコピーします。

    使い方
    1. Start matching を押し、コピー元の要素を選択します。
    2. プロパティと必要に応じてタイプを選び、互換性のあるコピー先を選択して Finish を押します。
    3. レポートを確認します。Copy Report で結果をコピーできます。

    ウィンドウ上部の Help で操作手順を開けます。その隣の ★ GitHub で NdevTools のリポジトリを開けます。

    オプションと動作
    文字はタイプ、位置合わせ、折り返し幅に対応し、タグは編集可能なタイプ、引出線、方向に対応します。

    安全性
    文字内容とタグの参照先は維持します。読み取り専用、ピン固定、グループ化、非互換の対象は報告し、拒否された変更はロールバックします。

    互換性
    pyRevit | IronPython 2.7

    作成者：Nataraj Devaraj。
  ko: |-
    NDEV TOOLS | MATCH PROPERTIES

    기본 모델 요소, 문자 주석, 태그, 치수 및 기타 Revit 주석의 유형과 호환되는 편집 가능 속성을 맞춥니다.

    사용 방법
    1. Start matching을 누르고 원본 요소를 선택합니다.
    2. 속성과 필요한 경우 요소 유형을 선택한 뒤 호환 대상을 고르고 Finish를 누릅니다.
    3. 보고서를 확인하고 Copy Report로 결과를 복사합니다.

    창 상단에서 Help를 누르면 사용 방법이 열립니다. 옆의 ★ GitHub를 누르면 NdevTools 저장소가 열립니다.

    옵션 및 동작
    문자는 유형, 정렬, 줄바꿈 너비를 지원하며 태그는 편집 가능한 유형, 지시선 및 방향을 지원합니다.

    안전
    문자 내용과 태그 호스트는 유지됩니다. 읽기 전용, 고정, 그룹 또는 호환되지 않는 대상은 보고되며 거부된 대상 변경은 롤백됩니다.

    호환성
    pyRevit | IronPython 2.7

    제작: Nataraj Devaraj.
  pl: |-
    NDEV TOOLS | MATCH PROPERTIES

    Dopasuj typy i zgodne edytowalne właściwości natywnych elementów modelu, notatek tekstowych, oznaczeń, wymiarów i innych opisów.

    SPOSÓB UŻYCIA
    1. Kliknij Start matching i wybierz element źródłowy.
    2. Zaznacz właściwości oraz opcjonalnie typ, wybierz zgodne cele i kliknij Finish.
    3. Sprawdź raport; Copy Report kopiuje wyniki.

    U góry okna przycisk Help otwiera instrukcję, a znajdujący się obok przycisk ★ GitHub otwiera repozytorium NdevTools.

    OPCJE I DZIAŁANIE
    Tekst obsługuje typ, wyrównanie i szerokość zawijania; oznaczenia obsługują typ, linie odniesienia i orientację, jeśli są edytowalne.

    BEZPIECZEŃSTWO
    Treść tekstu i oznaczane elementy pozostają zachowane. Cele tylko do odczytu, przypięte, zgrupowane lub niezgodne są raportowane; odrzucone zmiany są wycofywane.

    ZGODNOŚĆ

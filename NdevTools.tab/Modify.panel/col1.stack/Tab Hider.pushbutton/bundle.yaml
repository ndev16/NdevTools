  ja: |-
    NDEV TOOLS | TAB HIDER

    チェックボックスで、読み込み済みの Revit リボンタブとアドインパネルを非表示または再表示します。

    使い方
    1. All Revit Tabs、または読み込み済みアドインタブのページを開きます。
    2. 表示する項目をオン、非表示にする項目をオフにして Apply を押します。
    3. Show All で編集可能なすべての項目を再表示します。

    オプションと動作
    NdevTools と Modify はアクセス可能なままです。コンテキストタブと保護されたタブは引き続き Revit が制御します。

    安全性
    Apply または Show All を押すと、表示設定が %APPDATA%\NdevTools\TabHider\visibility.json に保存され、次回以降の Revit セッションで適用されます。プロジェクト要素は変更されません。

    互換性
    pyRevit | IronPython 2.7

    作成者：Nataraj Devaraj。
  ko: |-
    NDEV TOOLS | TAB HIDER

    확인란으로 로드된 Revit 리본 탭과 애드인 패널을 숨기거나 복원합니다.

    사용 방법
    1. All Revit Tabs 또는 로드된 애드인 탭의 페이지를 엽니다.
    2. 표시하려면 선택하고 숨기려면 해제한 다음 Apply를 누릅니다.
    3. Show All로 편집 가능한 모든 항목을 복원합니다.

    옵션 및 동작
    NdevTools와 Modify는 계속 접근할 수 있습니다. 상황별 탭과 보호된 탭은 Revit이 계속 제어합니다.

    안전
    Apply 또는 Show All을 누르면 표시 설정이 %APPDATA%\NdevTools\TabHider\visibility.json 파일에 저장되어 다음 Revit 세션부터 적용됩니다. 프로젝트 요소는 변경되지 않습니다.

    호환성
    pyRevit | IronPython 2.7

    제작: Nataraj Devaraj.
  pl: |-
    NDEV TOOLS | TAB HIDER

    Ukrywaj lub przywracaj załadowane karty wstążki Revit i panele dodatków za pomocą pól wyboru.

    SPOSÓB UŻYCIA
    1. Otwórz All Revit Tabs lub stronę załadowanej karty dodatku.
    2. Zaznacz, aby pokazać, odznacz, aby ukryć, a następnie kliknij Apply.
    3. Show All przywraca wszystkie edytowalne pozycje.

    OPCJE I DZIAŁANIE
    NdevTools i Modify pozostają dostępne. Karty kontekstowe i chronione nadal kontroluje Revit.

    BEZPIECZEŃSTWO
    Przyciski Apply i Show All zapisują ustawienia widoczności w pliku %APPDATA%\NdevTools\TabHider\visibility.json na kolejne sesje programu Revit. Elementy projektu nie są edytowane.

    ZGODNOŚĆ
    pyRevit | IronPython 2.7

    Autor: Nataraj Devaraj.

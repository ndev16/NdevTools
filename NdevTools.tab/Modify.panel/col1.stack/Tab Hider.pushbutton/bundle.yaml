tooltip:
  ar: |-
    NDEV TOOLS | TAB HIDER

    أخفِ علامات تبويب شريط Revit ولوحات الإضافات المحمّلة أو أعد إظهارها باستخدام مربعات الاختيار.

    طريقة الاستخدام
    1. افتح All Revit Tabs أو صفحة علامة تبويب إضافة محمّلة.
    2. حدد للإظهار وألغِ التحديد للإخفاء، ثم انقر Apply.
    3. استخدم Show All لاستعادة جميع العناصر القابلة للتعديل.

    الخيارات والسلوك
    يبقى NdevTools وModify متاحين. تظل علامات التبويب السياقية والمحمية تحت تحكم Revit.

    الأمان
    يحفظ الزرّان Apply وShow All إعدادات عرض الشريط في %APPDATA%\NdevTools\TabHider\visibility.json لاستخدامها في جلسات Revit اللاحقة دون تعديل عناصر المشروع.

    التوافق
    pyRevit | IronPython 2.7

    إعداد Nataraj Devaraj.
  pt_br: |-
    NDEV TOOLS | TAB HIDER

    Oculte ou restaure abas da faixa de opções do Revit e painéis de complementos carregados usando caixas de seleção.

    COMO USAR
    1. Abra All Revit Tabs ou a página de uma aba de complemento carregada.
    2. Marque para mostrar, desmarque para ocultar e clique em Apply.
    3. Use Show All para restaurar todas as entradas editáveis.

    OPÇÕES E COMPORTAMENTO
    NdevTools e Modify permanecem acessíveis. Abas contextuais e protegidas continuam sob controle do Revit.

    SEGURANÇA
    Apply e Show All salvam suas configurações de visibilidade em %APPDATA%\NdevTools\TabHider\visibility.json para as próximas sessões do Revit. Nenhum elemento do projeto é alterado.

    COMPATIBILIDADE
    pyRevit | IronPython 2.7

    Criado por Nataraj Devaraj.
  bg: |-
    NDEV TOOLS | TAB HIDER

    Скривайте или възстановявайте заредени раздели на лентата на Revit и панели на добавки чрез отметки.

    НАЧИН НА ИЗПОЛЗВАНЕ
    1. Отворете All Revit Tabs или страницата на зареден раздел на добавка.
    2. Отметнете за показване, махнете отметката за скриване и натиснете Apply.
    3. Използвайте Show All, за да възстановите всички редактируеми записи.

    ОПЦИИ И ПОВЕДЕНИЕ
    NdevTools и Modify остават достъпни. Контекстните и защитените раздели се управляват от Revit.

    БЕЗОПАСНОСТ
    Apply и Show All записват настройките ви за видимост в %APPDATA%\NdevTools\TabHider\visibility.json за следващите сесии на Revit. Елементите на проекта не се редактират.

    СЪВМЕСТИМОСТ
    pyRevit | IronPython 2.7

    Създадено от Nataraj Devaraj.
  chinese_s: |-
    NDEV TOOLS | TAB HIDER

    使用复选框隐藏或恢复已加载的 Revit 功能区选项卡和插件面板。

    使用方法
    1. 打开 All Revit Tabs 或已加载插件选项卡的页面。
    2. 勾选以显示，取消勾选以隐藏，然后点击 Apply。
    3. 使用 Show All 恢复所有可编辑条目。

    选项与行为
    NdevTools 和 Modify 始终可访问。上下文和受保护的选项卡仍由 Revit 控制。

    安全
    点击 Apply 或 Show All 后，显示设置将保存到 %APPDATA%\NdevTools\TabHider\visibility.json，并在以后的 Revit 会话中使用。项目元素不会改变。

    兼容性
    pyRevit | IronPython 2.7

    作者：Nataraj Devaraj。
  chinese_t: |-
    NDEV TOOLS | TAB HIDER

    使用核取方塊隱藏或還原已載入的 Revit 功能區頁籤和增益集面板。

    使用方法
    1. 開啟 All Revit Tabs 或已載入增益集頁籤的頁面。
    2. 勾選以顯示、取消勾選以隱藏，然後按 Apply。
    3. 使用 Show All 還原所有可編輯項目。

    選項與行為
    NdevTools 和 Modify 保持可用。關聯式及受保護的頁籤仍由 Revit 控制。

    安全
    按下 Apply 或 Show All 後，顯示設定會儲存至 %APPDATA%\NdevTools\TabHider\visibility.json，並在日後的 Revit 工作階段中使用。專案元素不會變更。

    相容性
    pyRevit | IronPython 2.7

    作者：Nataraj Devaraj。
  cs: |-
    NDEV TOOLS | TAB HIDER

    Pomocí zaškrtávacích polí skryjte nebo obnovte načtené karty pásu karet Revitu a panely doplňků.

    JAK POUŽÍVAT
    1. Otevřete All Revit Tabs nebo stránku načtené karty doplňku.
    2. Zaškrtnutím zobrazíte, zrušením skryjete; poté klikněte na Apply.
    3. Pomocí Show All obnovíte všechny upravitelné položky.

    MOŽNOSTI A CHOVÁNÍ
    NdevTools a Modify zůstávají dostupné. Kontextové a chráněné karty řídí Revit.

    BEZPEČNOST
    Tlačítka Apply a Show All uloží nastavení viditelnosti do souboru %APPDATA%\NdevTools\TabHider\visibility.json pro další relace Revitu. Prvky projektu se neupravují.

    KOMPATIBILITA
    pyRevit | IronPython 2.7

    Vytvořil Nataraj Devaraj.

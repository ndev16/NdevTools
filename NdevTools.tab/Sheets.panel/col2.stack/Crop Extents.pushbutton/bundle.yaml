author: Nataraj Devaraj
tooltip:
  en_us: "NDEV TOOLS | MATCH CROP REGIONS\n\nMatch crop boundaries across multiple Revit plan views using one reference view.\n\nWORKFLOW\n1. Select a reference plan view with Crop View enabled.\n2. Select one or more target plan views.\n3. Choose whether to apply the reference view scale.\n   YES = Copy crop and scale.\n   NO = Copy crop only; retain target scales.\n4. Confirm and review the results.\n\nFEATURES\n- Matches model crop boundaries using model coordinates.\n- Supports multiple target plan views in one run.\n- Optionally copies the reference view scale.\n- Copies crop visibility and annotation crop offsets where supported.\n- Removes split crops from target views when possible.\n- Skips target views with scope-box-controlled crops.\n- Processes each target in its own transaction and reports failures.\n\nNOTES\n- The reference view must have an active, single (unsplit) crop region.\n- Only compatible non-template plan views are listed.\n\nCOMPATIBILITY\nRevit 2022-2027 | pyRevit / IronPython 2.7\n\nCreated by Nataraj Devaraj."
  en_gb: "Copy a reference plan view crop region to compatible target plan views. Optionally copy the view scale. Target views controlled by scope boxes are skipped; results are reported per view.\n\nNdevTools | Smart BIM Tools"
  fr_fr: "Copie le cadrage d'une vue en plan de référence vers des vues en plan compatibles. La copie de l'échelle est facultative. Les vues contrôlées par des zones de définition sont ignorées. Résultats par vue.\n\nNdevTools | Smart BIM Tools"
  de_de: "Überträgt den Zuschneidebereich einer Referenz-Grundrissansicht auf kompatible Zielansichten. Der Ansichtsmaßstab kann optional übernommen werden. Durch Ansichtsbereiche gesteuerte Ziele werden übersprungen.\n\nNdevTools | Smart BIM Tools"
  it_it: "Copia il ritaglio di una vista in pianta di riferimento nelle viste compatibili. La copia della scala è facoltativa. Le viste controllate da riquadri di definizione vengono ignorate. Risultati per vista.\n\nNdevTools | Smart BIM Tools"
  es_es: "Copia la región de recorte de una vista de planta de referencia a vistas compatibles. Opcionalmente copia la escala. Se omiten vistas controladas por cajas de referencia. Se informa del resultado por vista.\n\nNdevTools | Smart BIM Tools"
  ar: "انسخ حدود القص من مخطط مرجعي له قص مفعل وغير مقسم إلى عدة مخططات متوافقة. يمكنك أيضاً نسخ المقياس أو الاحتفاظ بمقياس كل عرض. تُتجاوز العروض التي يتحكم صندوق النطاق بقصّها؛ راجع تقرير الأخطاء.\n\nNdevTools | Smart BIM Tools"
  bg: "Копирайте границите на изрязване от референтен план с активно и неразделено изрязване към съвместими планове. По избор копирайте и мащаба или запазете мащабите на целевите изгледи. Изгледите със зависимост от scope box се пропускат.\n\nNdevTools | Smart BIM Tools"
  chinese_s: "将启用且未分割裁剪的参考平面视图裁剪范围复制到多个兼容平面视图。可选择同时复制比例，或保留目标视图的比例。受范围框控制的目标视图将被跳过；请检查结果报告。\n\nNdevTools | Smart BIM Tools"
  chinese_t: "將已啟用且未分割裁剪的參考平面視圖之裁剪範圍，複製到多個相容平面視圖。可選擇同步複製比例或保留目標比例。受範圍框控制的目標視圖會略過；請檢查報告。\n\nNdevTools | Smart BIM Tools"
  cs: "Zkopírujte hranice ořezu z referenčního půdorysu s aktivním nerozděleným ořezem do kompatibilních půdorysů. Volitelně přeneste také měřítko nebo zachovejte měřítka cílů. Pohledy řízené rozsahem Scope Box se přeskočí.\n\nNdevTools | Smart BIM Tools"
  fa: "مرز برش را از پلان مرجع با برش فعال و یکپارچه به چند پلان سازگار کپی کنید. می‌توانید مقیاس را نیز کپی کنید یا مقیاس مقصد را نگه دارید. نماهایی که برش آن‌ها با Scope Box کنترل می‌شود رد می‌شوند؛ گزارش را بررسی کنید.\n\nNdevTools | Smart BIM Tools"
  hu: "Másolja a vágási határokat egy aktív, nem felosztott vágású referencia-alaprajzról kompatibilis célalaprajzokra. A lépték másolása választható; egyébként a cél léptéke megmarad. A Scope Box által vezérelt vágású nézetek kimaradnak.\n\nNdevTools | Smart BIM Tools"
  ja: "切り抜きが有効で分割されていない参照平面ビューのクロップ境界を、互換性のある複数の平面ビューにコピーします。縮尺もコピーするか、対象の縮尺を維持するか選べます。スコープボックス管理のビューはスキップされます。\n\nNdevTools | Smart BIM Tools"
  ko: "자르기가 활성화되고 분할되지 않은 기준 평면도의 자르기 경계를 여러 호환 평면도에 복사합니다. 축척도 복사하거나 대상 축척을 유지할 수 있습니다. 범위 상자로 자르기를 제어하는 뷰는 건너뜁니다.\n\nNdevTools | Smart BIM Tools"
  nl_nl: "Kopieer de uitsnedegrenzen van een referentieplattegrond met actieve, ongedeelde uitsnede naar andere geschikte plattegronden. Kopieer optioneel de schaal of behoud de doelschalen. Aanzichten met scopebox-gestuurde uitsneden worden overgeslagen.\n\nNdevTools | Smart BIM Tools"
  pl: "Kopiuj granice przycięcia z rzutu referencyjnego z aktywnym, niepodzielonym przycięciem do zgodnych rzutów. Opcjonalnie kopiuj skalę lub zachowaj skale docelowe. Widoki sterowane zakresem Scope Box są pomijane; sprawdź raport.\n\nNdevTools | Smart BIM Tools"
  pt_br: "Copie a região de recorte de uma vista de planta de referência com recorte ativo e não dividido para outras plantas compatíveis. Copie a escala opcionalmente ou mantenha as escalas originais. Vistas controladas por caixa de escopo são ignoradas; confira o relatório.\n\nNdevTools | Smart BIM Tools"
  ru: "Копируйте границы обрезки из опорного плана с включённой неразделённой обрезкой в совместимые планы. Масштаб можно перенести или оставить исходный масштаб целевых видов. Виды с обрезкой, управляемой областью видимости (Scope Box), пропускаются.\n\nNdevTools | Smart BIM Tools"
  uk: "Копіюйте межі обрізання з опорного плану з увімкненим нерозділеним обрізанням до сумісних планів. Можна перенести масштаб або зберегти масштаби цільових видів. Види з обрізанням, керованим Scope Box, пропускаються.\n\nNdevTools | Smart BIM Tools"

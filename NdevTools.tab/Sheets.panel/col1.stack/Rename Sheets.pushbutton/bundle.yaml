tooltip:
  en_us: "NDEV TOOLS | SHEET MANAGER\n\nCreate multiple Revit sheets or rename existing sheets using one convenient tool.\n\nCREATE SHEETS\n1. Open the Create Sheets tab.\n2. Select a title block type.\n3. Enter one sheet per line:\n   S1.1 - FOUNDATION SLAB PLAN\n   S1.2 - LEVEL 1 FRAMING PLAN\n4. Click Create Sheets and confirm.\n\nRENAME SHEETS\n1. Open the Rename Sheets tab.\n2. Click Select Sheets to Rename.\n3. Select one or more existing sheets.\n4. Edit sheet numbers and/or names.\n5. Click Apply Rename and confirm.\n\nFEATURES\n- Batch create and rename Revit sheets.\n- Select title block types.\n- Detect duplicate sheet numbers.\n- Validate sheet numbers and names.\n- Support sheet number swapping.\n- Display success and error reports.\n- Integrated Help, GitHub and LinkedIn links.\n\nCOMPATIBILITY\nRevit 2022-2027\npyRevit / IronPython 2.7\n\nCreated by Nataraj Devaraj."
  en_gb: "Create multiple Revit sheets or rename sheet numbers and names in batches. Choose title blocks; duplicate sheet numbers and invalid names are checked. Review the reported results.\n\nNdevTools | Smart BIM Tools"
  fr_fr: "Crée plusieurs feuilles Revit ou modifie en lot leurs numéros et noms. Choisissez les cartouches ; les numéros en double et les noms incorrects sont vérifiés. Consultez le bilan.\n\nNdevTools | Smart BIM Tools"
  de_de: "Erstellt mehrere Revit-Planblätter oder ändert Blattnummern und Namen stapelweise. Schriftfelder auswählen; doppelte Blattnummern und ungültige Namen werden geprüft. Ergebnisse kontrollieren.\n\nNdevTools | Smart BIM Tools"
  it_it: "Crea più tavole Revit oppure rinomina in serie numeri e nomi delle tavole. Scegliere i cartigli; vengono controllati duplicati e nomi non validi. Esaminare il riepilogo.\n\nNdevTools | Smart BIM Tools"
  es_es: "Crea varios planos de Revit o cambia sus números y nombres por lotes. Seleccione cuadros de rotulación; se comprueban números duplicados y nombres no válidos. Revise el informe.\n\nNdevTools | Smart BIM Tools"
  ar: "أنشئ عدة لوحات Revit دفعة واحدة باختيار قالب اللوحة وإدخال الرقم والاسم، أو حدّد لوحات موجودة لإعادة ترقيمها وتسميتها. تتحقق الأداة من الأرقام المكررة وتدعم تبادل الأرقام؛ راجع تقرير النتائج قبل اعتماد العمل.\n\nNdevTools | Smart BIM Tools"
  bg: "Създавайте листове пакетно с избран надпис и въведени номер и име или преименувайте съществуващи листове. Инструментът проверява дублирани номера, поддържа разменяне на номерата и извежда отчет.\n\nNdevTools | Smart BIM Tools"
  chinese_s: "选择标题栏并输入图纸编号、名称以批量创建 Revit 图纸，或选择现有图纸进行重新编号和重命名。工具会检查重复编号、支持交换图纸编号，并显示操作结果。\n\nNdevTools | Smart BIM Tools"
  chinese_t: "選擇圖框並輸入圖紙編號、名稱，即可批次建立 Revit 圖紙；亦可選取現有圖紙重新編號及命名。工具會檢查重複編號、支援交換編號，並顯示操作報告。\n\nNdevTools | Smart BIM Tools"
  cs: "Vytvářejte hromadně listy Revitu výběrem razítka a zadáním čísla a názvu nebo přejmenovávejte existující listy. Nástroj kontroluje duplicitní čísla, podporuje prohození čísel a zobrazuje výsledky.\n\nNdevTools | Smart BIM Tools"
  fa: "چند شیت Revit را با انتخاب کادر عنوان و وارد کردن شماره و نام بسازید، یا شیت‌های موجود را برای تغییر شماره و نام انتخاب کنید. ابزار شماره‌های تکراری را بررسی می‌کند، جابه‌جایی شماره‌ها را می‌پذیرد و گزارش نتیجه می‌دهد.\n\nNdevTools | Smart BIM Tools"
  hu: "Hozzon létre több Revit-lapot címpecsét, lapszám és név megadásával, vagy nevezze át és számozza át a meglévő lapokat. Az eszköz ellenőrzi a duplikált lapszámokat, támogatja a számcserét és jelentést készít.\n\nNdevTools | Smart BIM Tools"
  ja: "タイトルブロックとシート番号・名前を指定して Revit シートを一括作成するか、既存シートを選択して名前と番号を変更します。重複番号の検証と番号の入れ替えに対応し、結果を表示します。\n\nNdevTools | Smart BIM Tools"
  ko: "표제란과 시트 번호 및 이름을 지정하여 Revit 시트를 일괄 생성하거나 기존 시트를 선택해 이름과 번호를 변경합니다. 중복 번호를 검사하고 번호 교환을 지원하며 결과를 보고합니다.\n\nNdevTools | Smart BIM Tools"
  nl_nl: "Maak meerdere Revit-bladen met een gekozen titelblok, bladnummer en naam, of selecteer bestaande bladen om ze te hernoemen en hernummeren. De tool controleert dubbele nummers, ondersteunt nummerwissels en toont een resultatenrapport.\n\nNdevTools | Smart BIM Tools"
  pl: "Twórz wiele arkuszy Revit, wybierając tabelkę rysunkową i wpisując numer oraz nazwę, lub zaznacz istniejące arkusze do zmiany numerów i nazw. Narzędzie sprawdza duplikaty, obsługuje zamianę numerów i pokazuje raport.\n\nNdevTools | Smart BIM Tools"
  pt_br: "Crie várias folhas selecionando uma legenda de folha e informando número e nome, ou selecione folhas existentes para renomear e renumerar. A ferramenta verifica números duplicados, aceita trocas de números e apresenta um relatório dos resultados.\n\nNdevTools | Smart BIM Tools"
  ru: "Создавайте листы Revit пакетно с выбранной основной надписью, номером и названием или переименовывайте и перенумеровывайте существующие листы. Инструмент проверяет повторяющиеся номера, поддерживает перестановку номеров и выводит отчёт.\n\nNdevTools | Smart BIM Tools"
  uk: "Створюйте аркуші Revit пакетно, вибираючи штамп і вводячи номер та назву, або змінюйте номери й назви наявних аркушів. Інструмент перевіряє дублікати, підтримує перестановку номерів і показує звіт.\n\nNdevTools | Smart BIM Tools"

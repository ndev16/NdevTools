
title: Sheet Pilot

author: Nataraj Devaraj

tooltip: "NDEVTOOLS | SHEET PILOT\n\nAutomate multi-sheet view placement using saved viewport positions in Autodesk Revit.\n\nPREREQUISITES:\n1. Manually place a reference view on a Revit sheet.\n2. Open Viewport Position Manager.\n3. Select the reference viewport.\n4. Capture and save its X/Y sheet position.\n5. Repeat to save additional positions if needed.\n\nHOW TO USE:\n1. Launch Sheet Pilot.\n2. Expand the sheet you want to configure.\n3. Click + Add View (maximum 25 views per sheet).\n4. Select an unplaced view.\n5. Select the required viewport type.\n6. Assign a previously saved sheet position.\n7. Repeat for other views and sheets.\n8. Click PLACE ALL VIEWS to execute.\n\nFEATURES:\n- Multi-sheet view placement.\n- Up to 25 views per sheet.\n- Reusable saved X/Y viewport positions.\n- Compatible plans, sections, 3D views, drafting views, legends and schedules.\n- Temporary visibility handling for supported views.\n- Restoration of original visibility and view templates.\n- Individual rollback protection for failed placements.\n\nIMPORTANT:\nAt least one saved viewport position is required before placing views. Saved positions are stored separately for each Revit version.\n\nCOMPATIBILITY:\nAutodesk Revit 2022-2027\npyRevit | IronPython 2.7\n\nDEVELOPER:\nNataraj Devaraj\nGitHub: https://github.com/ndev16/NdevTools\nLinkedIn: https://www.linkedin.com/in/nataraj016/"

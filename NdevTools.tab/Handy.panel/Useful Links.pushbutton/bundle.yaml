tooltip:
  en_us: "NDEV TOOLS | USEFUL LINKS\n\nHOW TO USE\n\nUse Image to Text and Convert Case inside a modeless Revit window. Switch between both sites, go back or forward, reload, or open the current page in your browser. Internet required.\n\nHELP, FOOTER & HUMOR\n\nHelp opens instructions and GitHub/LinkedIn links. The footer provides a Star NdevTools on GitHub button. BIM Humor is On by default; use the switch to turn it Off or On. Your choice is remembered for this tool. Next Joke changes the joke.\n\nCOMPATIBILITY\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreated by Nataraj Devaraj."
  en_gb: "NDEV TOOLS | USEFUL LINKS\n\nHOW TO USE\n\nUse Image to Text and Convert Case inside a modeless Revit window. Switch between both sites, go back or forward, reload, or open the current page in your browser. Internet required.\n\nHELP, FOOTER & HUMOUR\n\nHelp opens instructions and GitHub/LinkedIn links. The footer provides a Star NdevTools on GitHub button. BIM Humour is On by default; use the switch to turn it Off or On. Your choice is remembered for this tool. Next Joke changes the joke.\n\nCOMPATIBILITY\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreated by Nataraj Devaraj."
  fr_fr: "NDEV TOOLS | LIENS UTILES\n\nUTILISATION\n\nUtilisez Image to Text et Convert Case dans une fenêtre Revit non modale. Changez de site, naviguez, actualisez ou ouvrez la page dans votre navigateur. Internet requis.\n\nAIDE, PIED DE PAGE ET HUMOUR\n\nHelp ouvre les instructions et les liens GitHub/LinkedIn. Le pied de page propose un bouton pour soutenir NdevTools sur GitHub. L’humour BIM est activé par défaut ; utilisez le commutateur pour le désactiver ou le réactiver. Ce choix est mémorisé pour cet outil. Next Joke affiche une autre blague.\n\nCOMPATIBILITÉ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCréé par Nataraj Devaraj."
  de_de: "NDEV TOOLS | NÜTZLICHE LINKS\n\nANWENDUNG\n\nImage to Text und Convert Case in einem nichtmodalen Revit-Fenster nutzen. Zwischen Websites wechseln, vor/zurück navigieren, neu laden oder im Browser öffnen. Internet erforderlich.\n\nHILFE, FUSSZEILE UND HUMOR\n\nHelp öffnet Anleitungen und GitHub-/LinkedIn-Links. Die Fußzeile bietet eine Schaltfläche, um NdevTools auf GitHub einen Stern zu geben. BIM-Humor ist standardmäßig eingeschaltet; mit dem Schalter aus- oder einschalten. Die Auswahl wird für dieses Werkzeug gespeichert. Next Joke zeigt den nächsten Witz.\n\nKOMPATIBILITÄT\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nErstellt von Nataraj Devaraj."
  it_it: "NDEV TOOLS | LINK UTILI\n\nCOME USARE\n\nUsa Image to Text e Convert Case in una finestra Revit non modale. Passa da un sito all’altro, naviga, ricarica o apri la pagina nel browser. Richiede Internet.\n\nGUIDA, PIÈ DI PAGINA E UMORISMO\n\nHelp apre le istruzioni e i link GitHub/LinkedIn. Il piè di pagina offre un pulsante per assegnare una stella a NdevTools su GitHub. L’umorismo BIM è attivo inizialmente; usa il selettore per disattivarlo o riattivarlo. La scelta viene memorizzata per questo strumento. Next Joke mostra un’altra battuta.\n\nCOMPATIBILITÀ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreato da Nataraj Devaraj."
  es_es: "NDEV TOOLS | ENLACES ÚTILES\n\nCÓMO USAR\n\nUse Image to Text y Convert Case en una ventana Revit no modal. Cambie de sitio, navegue, recargue o abra la página en su navegador. Requiere Internet.\n\nAYUDA, PIE DE PÁGINA Y HUMOR\n\nHelp abre las instrucciones y los enlaces GitHub/LinkedIn. El pie de página ofrece un botón para dar una estrella a NdevTools en GitHub. El humor BIM está activado inicialmente; use el interruptor para desactivarlo o activarlo. Se recuerda la elección para esta herramienta. Next Joke muestra otro chiste.\n\nCOMPATIBILIDAD\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreado por Nataraj Devaraj."
  ar: "NDEV TOOLS | روابط مفيدة\n\nطريقة الاستخدام\n\nاستخدم Image to Text وConvert Case داخل نافذة Revit غير مشروطة. بدّل بين الموقعين وتنقل وأعد التحميل أو افتح الصفحة في المتصفح. يتطلب الإنترنت.\n\nالمساعدة والتذييل والفكاهة\n\nيفتح Help التعليمات وروابط GitHub وLinkedIn. يحتوي التذييل على زر لإضافة نجمة إلى NdevTools على GitHub. فكاهة BIM مفعّلة افتراضيًا؛ استخدم المفتاح لإيقافها أو تشغيلها. يُحفظ اختيارك لهذه الأداة. يعرض Next Joke نكتة أخرى.\n\nالتوافق\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nإعداد Nataraj Devaraj."
  bg: "NDEV TOOLS | ПОЛЕЗНИ ВРЪЗКИ\n\nНАЧИН НА ИЗПОЛЗВАНЕ\n\nИзползвайте Image to Text и Convert Case в немодален прозорец на Revit. Сменяйте сайтовете, навигирайте, презареждайте или отваряйте в браузъра. Нужен е интернет.\n\nПОМОЩ, ДОЛЕН КОЛОНТИТУЛ И ХУМОР\n\nHelp отваря инструкции и връзки към GitHub/LinkedIn. Долният колонтитул има бутон за добавяне на звезда към NdevTools в GitHub. BIM хуморът е включен по подразбиране; използвайте превключвателя за изключване или включване. Изборът се запомня за този инструмент. Next Joke показва друга шега.\n\nСЪВМЕСТИМОСТ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nСъздадено от Nataraj Devaraj."
  chinese_s: "NDEV TOOLS | 实用 链接\n\n使用方法\n\n在 Revit 非模态窗口中使用 Image to Text 和 Convert Case。可切换两个网站、前进后退、重新加载，或在浏览器中打开当前页面。需要联网。\n\n帮助、页脚与幽默\n\nHelp 打开操作说明以及 GitHub/LinkedIn 链接，页脚提供为 GitHub 上的 NdevTools 加星标的按钮。BIM 幽默默认开启，可通过开关关闭或开启，并记住此工具的选择。Next Joke 显示下一条笑话。\n\n兼容性\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n创建者：Nataraj Devaraj。"
  chinese_t: "NDEV TOOLS | 實用 連結\n\n使用方法\n\n在 Revit 非模態視窗中使用 Image to Text 和 Convert Case。可切換兩個網站、上一頁下一頁、重新載入，或在瀏覽器開啟目前頁面。需要網路。\n\n說明、頁尾與幽默\n\nHelp 開啟操作說明與 GitHub/LinkedIn 連結，頁尾提供為 GitHub 上的 NdevTools 加星號的按鈕。BIM 幽默預設開啟，可透過開關關閉或開啟，並記住此工具的選擇。Next Joke 顯示下一則笑話。\n\n相容性\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n建立者：Nataraj Devaraj。"
  cs: "NDEV TOOLS | UŽITEČNÉ ODKAZY\n\nPOUŽITÍ\n\nPoužívejte Image to Text a Convert Case v nemodálním okně Revitu. Přepínejte weby, procházejte historii, obnovte stránku nebo ji otevřete v prohlížeči. Vyžaduje internet.\n\nNÁPOVĚDA, ZÁPATÍ A HUMOR\n\nHelp otevře pokyny a odkazy GitHub/LinkedIn. Zápatí nabízí tlačítko pro přidání hvězdičky NdevTools na GitHubu. BIM humor je standardně zapnutý; přepínačem jej vypnete nebo zapnete. Volba se pro tento nástroj ukládá. Next Joke zobrazí další vtip.\n\nKOMPATIBILITA\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nVytvořil Nataraj Devaraj."
  fa: "NDEV TOOLS | پیوندهای مفید\n\nروش استفاده\n\nاز Image to Text وConvert Case در پنجره غیرمودال Revit استفاده کنید. بین سایت‌ها جابه‌جا شوید، پیمایش یا بارگذاری مجدد کنید یا صفحه را در مرورگر باز کنید. اینترنت لازم است.\n\nراهنما، پابرگ و طنز\n\nHelp دستورالعمل‌ها و پیوندهای GitHub وLinkedIn را باز می‌کند؛ پابرگ دکمه‌ای برای ستاره دادن به NdevTools در GitHub دارد. طنز BIM پیش‌فرض روشن است؛ با کلید آن را خاموش یا روشن کنید. انتخاب شما برای این ابزار ذخیره می‌شود. Next Joke شوخی بعدی را نشان می‌دهد.\n\nسازگاری\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nساخته Nataraj Devaraj."
  hu: "NDEV TOOLS | HASZNOS HIVATKOZÁSOK\n\nHASZNÁLAT\n\nHasználja az Image to Text és Convert Case oldalakat nem modális Revit-ablakban. Váltson oldalt, navigáljon, töltsön újra vagy nyissa meg böngészőben. Internet szükséges.\n\nSÚGÓ, LÁBLÉC ÉS HUMOR\n\nA Help útmutatót és GitHub-/LinkedIn-hivatkozásokat nyit meg. A lábléc gombjával csillagot adhat az NdevTools projektnek a GitHubon. A BIM-humor alapértelmezés szerint bekapcsolt. A kapcsolóval ki- és bekapcsolható; az eszköz megjegyzi a választást. A Next Joke másik viccet mutat.\n\nKOMPATIBILITÁS\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nKészítette: Nataraj Devaraj."
  ja: "NDEV TOOLS | 便利な リンク\n\n使用方法\n\nRevit のモードレスウィンドウ内で Image to Text と Convert Case を利用できます。サイト切替、戻る・進む、再読み込み、ブラウザーで開く操作に対応します。インターネット接続が必要です。\n\nヘルプ・フッター・ユーモア\n\nHelp で操作説明と GitHub/LinkedIn リンクを開けます。フッターには GitHub の NdevTools にスターを付けるためのボタンがあります。BIM ユーモアは既定でオンです。スイッチでオン・オフを切り替えると、このツールの設定として保存されます。Next Joke で別のジョークを表示します。\n\n互換性\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n作成者：Nataraj Devaraj。"
  ko: "NDEV TOOLS | 유용한 링크\n\n사용 방법\n\nRevit 모덜리스 창에서 Image to Text와 Convert Case를 사용합니다. 사이트 전환, 뒤로/앞으로 이동, 새로 고침 또는 브라우저 열기를 지원합니다. 인터넷이 필요합니다.\n\n도움말, 바닥글 및 유머\n\nHelp에서 사용 안내와 GitHub/LinkedIn 링크를 엽니다. 바닥글에는 GitHub의 NdevTools에 별표를 주기 위한 버튼이 있습니다. BIM 유머는 기본적으로 켜져 있으며 스위치로 끄거나 켤 수 있습니다. 도구별 선택이 저장됩니다. Next Joke는 다른 농담을 표시합니다.\n\n호환성\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n제작: Nataraj Devaraj."
  nl_nl: "NDEV TOOLS | HANDIGE LINKS\n\nGEBRUIK\n\nGebruik Image to Text en Convert Case in een niet-modaal Revit-venster. Wissel websites, navigeer, herlaad of open de pagina in uw browser. Internet vereist.\n\nHELP, VOETTEKST EN HUMOR\n\nHelp opent instructies en GitHub-/LinkedIn-links. De voettekst bevat een knop om NdevTools op GitHub een ster te geven. BIM-humor staat standaard aan; gebruik de schakelaar om dit uit of aan te zetten. De keuze wordt voor dit hulpmiddel bewaard. Next Joke toont een andere grap.\n\nCOMPATIBILITEIT\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nGemaakt door Nataraj Devaraj."
  pl: "NDEV TOOLS | PRZYDATNE ŁĄCZA\n\nSPOSÓB UŻYCIA\n\nKorzystaj z Image to Text i Convert Case w niemodalnym oknie Revitu. Przełączaj strony, nawiguj, odświeżaj lub otwieraj stronę w przeglądarce. Wymaga internetu.\n\nPOMOC, STOPKA I HUMOR\n\nHelp otwiera instrukcje i łącza GitHub/LinkedIn. Stopka zawiera przycisk umożliwiający przyznanie gwiazdki NdevTools w GitHub. Humor BIM jest domyślnie włączony; przełącznik pozwala go wyłączyć lub włączyć. Wybór jest zapamiętywany dla narzędzia. Next Joke wyświetla kolejny żart.\n\nZGODNOŚĆ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nAutor: Nataraj Devaraj."
  pt_br: "NDEV TOOLS | LINKS ÚTEIS\n\nCOMO USAR\n\nUse Image to Text e Convert Case em uma janela não modal do Revit. Alterne entre os sites, navegue, recarregue ou abra a página no navegador. Requer internet.\n\nAJUDA, RODAPÉ E HUMOR\n\nHelp abre instruções e links do GitHub/LinkedIn. O rodapé oferece um botão para dar uma estrela ao NdevTools no GitHub. O humor BIM fica ativado por padrão; use o interruptor para desativar ou ativar. A escolha é salva para esta ferramenta. Next Joke mostra outra piada.\n\nCOMPATIBILIDADE\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCriado por Nataraj Devaraj."
  ru: "NDEV TOOLS | ПОЛЕЗНЫЕ ССЫЛКИ\n\nПОРЯДОК РАБОТЫ\n\nИспользуйте Image to Text и Convert Case в немодальном окне Revit. Переключайте сайты, переходите назад/вперёд, обновляйте или открывайте страницу в браузере. Нужен интернет.\n\nСПРАВКА, НИЖНИЙ КОЛОНТИТУЛ И ЮМОР\n\nHelp открывает инструкции и ссылки GitHub/LinkedIn. В нижнем колонтитуле есть кнопка для добавления звезды NdevTools на GitHub. BIM-юмор включён по умолчанию; переключатель выключает или включает его. Выбор сохраняется для этого инструмента. Next Joke показывает следующую шутку.\n\nСОВМЕСТИМОСТЬ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nАвтор: Nataraj Devaraj."
  uk: "NDEV TOOLS | КОРИСНІ ПОСИЛАННЯ\n\nПОРЯДОК ВИКОРИСТАННЯ\n\nВикористовуйте Image to Text і Convert Case в немодальному вікні Revit. Перемикайте сайти, переходьте назад/уперед, оновлюйте або відкривайте сторінку в браузері. Потрібен інтернет.\n\nДОВІДКА, НИЖНІЙ КОЛОНТИТУЛ І ГУМОР\n\nHelp відкриває інструкції та посилання GitHub/LinkedIn. Нижній колонтитул містить кнопку для додавання зірки NdevTools на GitHub. BIM-гумор типово ввімкнений; перемикач вимикає або вмикає його. Вибір зберігається для цього інструмента. Next Joke показує наступний жарт.\n\nСУМІСНІСТЬ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nАвтор: Nataraj Devaraj."

tooltip:
  en_us: "NDEV TOOLS | NOTES\n\nHOW TO USE\n\nTake personal notes beside Revit. Create and search notes, save manually or automatically, and export a text copy. Notes are stored on your computer.\n\nFORMATTING & IMAGES\n\nFormat fonts and sizes, bold/italic/underline, lists and alignment. Apply text, highlight and page colors. Insert, paste and resize images. Export a Word-compatible RTF with formatting and images.\nA4 sheets: choose Portrait (210 × 297 mm) or Landscape (297 × 210 mm) for each sheet. Add multiple sheets inside one note and switch using the sheet dropdown. Save and export all sheets together; RTF keeps each orientation and 20 mm margins. The writing area fits the window.\n\nHELP, FOOTER & HUMOR\n\nHelp opens instructions and GitHub/LinkedIn links. The footer provides a Star NdevTools on GitHub button. BIM Humor is On by default; use the switch to turn it Off or On. Your choice is remembered for this tool. Next Joke changes the joke.\n\nCOMPATIBILITY\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreated by Nataraj Devaraj."
  en_gb: "NDEV TOOLS | NOTES\n\nHOW TO USE\n\nTake personal notes beside Revit. Create and search notes, save manually or automatically, and export a text copy. Notes are stored on your computer.\n\nFORMATTING & IMAGES\n\nFormat fonts and sizes, bold/italic/underline, lists and alignment. Apply text, highlight and page colours. Insert, paste and resize images. Export a Word-compatible RTF with formatting and images.\nA4 sheets: choose Portrait (210 × 297 mm) or Landscape (297 × 210 mm) for each sheet. Add multiple sheets inside one note and switch using the sheet dropdown. Save and export all sheets together; RTF keeps each orientation and 20 mm margins. The writing area fits the window.\n\nHELP, FOOTER & HUMOUR\n\nHelp opens instructions and GitHub/LinkedIn links. The footer provides a Star NdevTools on GitHub button. BIM Humour is On by default; use the switch to turn it Off or On. Your choice is remembered for this tool. Next Joke changes the joke.\n\nCOMPATIBILITY\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreated by Nataraj Devaraj."
  fr_fr: "NDEV TOOLS | NOTES\n\nUTILISATION\n\nPrenez des notes personnelles dans Revit. Créez et recherchez des notes, enregistrez-les manuellement ou automatiquement et exportez une copie texte. Stockage sur votre ordinateur.\n\nMISE EN FORME ET IMAGES\n\nModifiez polices, tailles, gras/italique/souligné, listes et alignement. Choisissez les couleurs du texte, du surlignage et de la page. Insérez, collez et redimensionnez des images. Exportez en RTF compatible Word avec mise en forme et images.\nFeuilles A4 : choisissez Portrait (210 × 297 mm) ou Paysage (297 × 210 mm) pour chaque feuille. Ajoutez plusieurs feuilles dans une note et changez de feuille dans la liste. Enregistrez et exportez toutes les feuilles ensemble ; le RTF conserve les orientations et des marges de 20 mm. La zone de rédaction s’adapte à la fenêtre.\n\nAIDE, PIED DE PAGE ET HUMOUR\n\nHelp ouvre les instructions et les liens GitHub/LinkedIn. Le pied de page propose un bouton pour soutenir NdevTools sur GitHub. L’humour BIM est activé par défaut ; utilisez le commutateur pour le désactiver ou le réactiver. Ce choix est mémorisé pour cet outil. Next Joke affiche une autre blague.\n\nCOMPATIBILITÉ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCréé par Nataraj Devaraj."
  de_de: "NDEV TOOLS | NOTIZEN\n\nANWENDUNG\n\nPersönliche Notizen neben Revit: erstellen, suchen, manuell oder automatisch speichern und als Text exportieren. Die Notizen bleiben auf Ihrem Computer.\n\nFORMATIERUNG UND BILDER\n\nSchriftart und Größe, Fett/Kursiv/Unterstrichen, Listen und Ausrichtung ändern. Text-, Hervorhebungs- und Seitenfarben wählen. Bilder einfügen, einfügen aus Zwischenablage und skalieren. Als Word-kompatible RTF-Datei mit Formatierung und Bildern exportieren.\nA4-Blätter: je Blatt Hochformat (210 × 297 mm) oder Querformat (297 × 210 mm) wählen. Mehrere Blätter in einer Notiz hinzufügen und über die Liste wechseln. Alle Blätter gemeinsam speichern und exportieren; RTF behält die Ausrichtung und 20 mm Rand. Der Schreibbereich passt sich dem Fenster an.\n\nHILFE, FUSSZEILE UND HUMOR\n\nHelp öffnet Anleitungen und GitHub-/LinkedIn-Links. Die Fußzeile bietet eine Schaltfläche, um NdevTools auf GitHub einen Stern zu geben. BIM-Humor ist standardmäßig eingeschaltet; mit dem Schalter aus- oder einschalten. Die Auswahl wird für dieses Werkzeug gespeichert. Next Joke zeigt den nächsten Witz.\n\nKOMPATIBILITÄT\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nErstellt von Nataraj Devaraj."
  it_it: "NDEV TOOLS | NOTE\n\nCOME USARE\n\nPrendi note personali accanto a Revit. Crea e cerca note, salvale manualmente o automaticamente ed esporta una copia di testo. Le note sono memorizzate sul computer.\n\nFORMATTAZIONE E IMMAGINI\n\nImposta caratteri, dimensioni, grassetto/corsivo/sottolineato, elenchi e allineamento. Applica colori a testo, evidenziazione e pagina. Inserisci, incolla e ridimensiona immagini. Esporta in RTF compatibile con Word con formattazione e immagini.\nFogli A4: scegli Verticale (210 × 297 mm) o Orizzontale (297 × 210 mm) per ogni foglio. Aggiungi più fogli nella stessa nota e selezionali dal menu. Salva ed esporta tutti i fogli insieme; RTF mantiene orientamento e margini di 20 mm. L’area di scrittura si adatta alla finestra.\n\nGUIDA, PIÈ DI PAGINA E UMORISMO\n\nHelp apre le istruzioni e i link GitHub/LinkedIn. Il piè di pagina offre un pulsante per assegnare una stella a NdevTools su GitHub. L’umorismo BIM è attivo inizialmente; usa il selettore per disattivarlo o riattivarlo. La scelta viene memorizzata per questo strumento. Next Joke mostra un’altra battuta.\n\nCOMPATIBILITÀ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreato da Nataraj Devaraj."
  es_es: "NDEV TOOLS | NOTAS\n\nCÓMO USAR\n\nTome notas personales junto a Revit. Cree y busque notas, guárdelas manual o automáticamente y exporte una copia de texto. Las notas se almacenan en su equipo.\n\nFORMATO E IMÁGENES\n\nConfigure fuentes, tamaños, negrita/cursiva/subrayado, listas y alineación. Aplique colores al texto, resaltado y página. Inserte, pegue y cambie el tamaño de imágenes. Exporte RTF compatible con Word con formato e imágenes.\nHojas A4: elija Vertical (210 × 297 mm) u Horizontal (297 × 210 mm) para cada hoja. Añada varias hojas en una nota y cambie entre ellas en la lista. Guarde y exporte todas juntas; RTF conserva las orientaciones y los márgenes de 20 mm. El área de escritura se adapta a la ventana.\n\nAYUDA, PIE DE PÁGINA Y HUMOR\n\nHelp abre las instrucciones y los enlaces GitHub/LinkedIn. El pie de página ofrece un botón para dar una estrella a NdevTools en GitHub. El humor BIM está activado inicialmente; use el interruptor para desactivarlo o activarlo. Se recuerda la elección para esta herramienta. Next Joke muestra otro chiste.\n\nCOMPATIBILIDAD\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCreado por Nataraj Devaraj."
  ar: "NDEV TOOLS | ملاحظات\n\nطريقة الاستخدام\n\nدوّن ملاحظات شخصية بجانب Revit. أنشئ الملاحظات وابحث فيها واحفظها يدويًا أو تلقائيًا وصدّر نسخة نصية. تُخزّن الملاحظات على جهازك.\n\nالتنسيق والصور\n\nنسّق الخطوط والأحجام والعريض والمائل والتسطير والقوائم والمحاذاة. اختر ألوان النص والتظليل والصفحة. أدرج الصور أو الصقها وغيّر حجمها. صدّر ملف RTF متوافقًا مع Word يتضمن التنسيق والصور.\nأوراق A4: اختر عموديًا (210 × 297 mm) أو أفقيًا (297 × 210 mm) لكل ورقة. أضف عدة أوراق داخل ملاحظة واحدة وتنقّل بينها من القائمة. تُحفظ وتُصدّر الأوراق معًا؛ يحتفظ RTF بالاتجاهات وهوامش 20 mm. تتكيف مساحة الكتابة مع النافذة.\n\nالمساعدة والتذييل والفكاهة\n\nيفتح Help التعليمات وروابط GitHub وLinkedIn. يحتوي التذييل على زر لإضافة نجمة إلى NdevTools على GitHub. فكاهة BIM مفعّلة افتراضيًا؛ استخدم المفتاح لإيقافها أو تشغيلها. يُحفظ اختيارك لهذه الأداة. يعرض Next Joke نكتة أخرى.\n\nالتوافق\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nإعداد Nataraj Devaraj."
  bg: "NDEV TOOLS | БЕЛЕЖКИ\n\nНАЧИН НА ИЗПОЛЗВАНЕ\n\nВодете лични бележки до Revit. Създавайте и търсете бележки, запазвайте ръчно или автоматично и експортирайте текстово копие. Съхраняват се на компютъра.\n\nФОРМАТИРАНЕ И ИЗОБРАЖЕНИЯ\n\nФорматирайте шрифтове, размери, удебелен/курсив/подчертан текст, списъци и подравняване. Избирайте цветове за текст, маркиране и страница. Вмъквайте, поставяйте и преоразмерявайте изображения. Експортирайте RTF за Word с форматиране и изображения.\nЛистове A4: изберете портретно (210 × 297 mm) или пейзажно (297 × 210 mm) за всеки лист. Добавяйте няколко листа в една бележка и ги избирайте от списъка. Записвайте и експортирайте всички заедно; RTF запазва ориентациите и полета 20 mm. Областта за писане се адаптира към прозореца.\n\nПОМОЩ, ДОЛЕН КОЛОНТИТУЛ И ХУМОР\n\nHelp отваря инструкции и връзки към GitHub/LinkedIn. Долният колонтитул има бутон за добавяне на звезда към NdevTools в GitHub. BIM хуморът е включен по подразбиране; използвайте превключвателя за изключване или включване. Изборът се запомня за този инструмент. Next Joke показва друга шега.\n\nСЪВМЕСТИМОСТ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nСъздадено от Nataraj Devaraj."
  chinese_s: "NDEV TOOLS | 笔记\n\n使用方法\n\n在 Revit 旁记录个人笔记。创建和搜索笔记，手动或自动保存，并导出文本副本。笔记保存在您的计算机上。\n\n格式与图片\n\n设置字体、字号、粗体、斜体、下划线、列表和对齐方式。选择文字、突出显示及页面颜色。插入、粘贴和调整图片大小。导出含格式和图片的 Word 兼容 RTF 文件。\nA4 工作页：每页可选纵向（210 × 297 mm）或横向（297 × 210 mm）。在同一笔记内添加多个工作页，并使用下拉列表切换。所有工作页一起保存和导出；RTF 保留各页方向及 20 mm 页边距。书写区域随窗口调整。\n\n帮助、页脚与幽默\n\nHelp 打开操作说明以及 GitHub/LinkedIn 链接，页脚提供为 GitHub 上的 NdevTools 加星标的按钮。BIM 幽默默认开启，可通过开关关闭或开启，并记住此工具的选择。Next Joke 显示下一条笑话。\n\n兼容性\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n创建者：Nataraj Devaraj。"
  chinese_t: "NDEV TOOLS | 筆記\n\n使用方法\n\n在 Revit 旁記錄個人筆記。建立和搜尋筆記，手動或自動儲存，並匯出文字副本。筆記儲存在您的電腦上。\n\n格式與圖片\n\n設定字型、字級、粗體、斜體、底線、清單和對齊方式。選擇文字、醒目提示及頁面色彩。插入、貼上及調整圖片大小。匯出包含格式和圖片的 Word 相容 RTF 檔案。\nA4 工作頁：每頁可選直向（210 × 297 mm）或橫向（297 × 210 mm）。在同一筆記內新增多個工作頁，並使用下拉清單切換。所有工作頁一起儲存與匯出；RTF 保留各頁方向及 20 mm 頁邊距。書寫區域隨視窗調整。\n\n說明、頁尾與幽默\n\nHelp 開啟操作說明與 GitHub/LinkedIn 連結，頁尾提供為 GitHub 上的 NdevTools 加星號的按鈕。BIM 幽默預設開啟，可透過開關關閉或開啟，並記住此工具的選擇。Next Joke 顯示下一則笑話。\n\n相容性\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n建立者：Nataraj Devaraj。"
  cs: "NDEV TOOLS | POZNÁMKY\n\nPOUŽITÍ\n\nPište osobní poznámky vedle Revitu. Vytvářejte a hledejte poznámky, ukládejte ručně nebo automaticky a exportujte textovou kopii. Poznámky se ukládají v počítači.\n\nFORMÁTOVÁNÍ A OBRÁZKY\n\nNastavujte písmo, velikost, tučné/kurzívu/podtržení, seznamy a zarovnání. Vyberte barvy textu, zvýraznění a stránky. Vkládejte obrázky ze souboru nebo schránky a měňte jejich velikost. Exportujte RTF pro Word s formátováním a obrázky.\nListy A4: pro každý list zvolte Na výšku (210 × 297 mm) nebo Na šířku (297 × 210 mm). Přidejte více listů do jedné poznámky a přepínejte je v seznamu. Všechny listy se ukládají a exportují společně; RTF zachová orientace a okraje 20 mm. Oblast psaní se přizpůsobuje oknu.\n\nNÁPOVĚDA, ZÁPATÍ A HUMOR\n\nHelp otevře pokyny a odkazy GitHub/LinkedIn. Zápatí nabízí tlačítko pro přidání hvězdičky NdevTools na GitHubu. BIM humor je standardně zapnutý; přepínačem jej vypnete nebo zapnete. Volba se pro tento nástroj ukládá. Next Joke zobrazí další vtip.\n\nKOMPATIBILITA\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nVytvořil Nataraj Devaraj."
  fa: "NDEV TOOLS | یادداشت‌ها\n\nروش استفاده\n\nدر کنار Revit یادداشت شخصی بنویسید. یادداشت‌ها را ایجاد و جست‌وجو کنید، دستی یا خودکار ذخیره کنید و نسخه متنی بگیرید. یادداشت‌ها روی رایانه شما ذخیره می‌شوند.\n\nقالب‌بندی و تصاویر\n\nقلم، اندازه، ضخیم/مورب/زیرخط، فهرست‌ها و تراز را تنظیم کنید. رنگ متن، برجسته‌سازی و صفحه را انتخاب کنید. تصویر درج یا جای‌گذاری کنید و اندازه آن را تغییر دهید. خروجی RTF سازگار با Word همراه با قالب‌بندی و تصاویر بگیرید.\nبرگه‌های A4: برای هر برگه عمودی (210 × 297 mm) یا افقی (297 × 210 mm) را انتخاب کنید. چند برگه در یک یادداشت اضافه کنید و با فهرست میان آن‌ها جابه‌جا شوید. همه برگه‌ها با هم ذخیره و صادر می‌شوند؛ RTF جهت‌ها و حاشیه‌های 20 mm را نگه می‌دارد. فضای نوشتن با پنجره تنظیم می‌شود.\n\nراهنما، پابرگ و طنز\n\nHelp دستورالعمل‌ها و پیوندهای GitHub وLinkedIn را باز می‌کند؛ پابرگ دکمه‌ای برای ستاره دادن به NdevTools در GitHub دارد. طنز BIM پیش‌فرض روشن است؛ با کلید آن را خاموش یا روشن کنید. انتخاب شما برای این ابزار ذخیره می‌شود. Next Joke شوخی بعدی را نشان می‌دهد.\n\nسازگاری\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nساخته Nataraj Devaraj."
  hu: "NDEV TOOLS | JEGYZETEK\n\nHASZNÁLAT\n\nKészítsen személyes jegyzeteket a Revit mellett. Jegyzetek létrehozása, keresése, kézi vagy automatikus mentése és szöveges exportálása. A jegyzetek a számítógépén tárolódnak.\n\nFORMÁZÁS ÉS KÉPEK\n\nÁllítson be betűtípust, méretet, félkövér/dőlt/aláhúzott szöveget, listákat és igazítást. Válasszon szöveg-, kiemelés- és oldalszínt. Szúrjon vagy illesszen be képeket, méretezze át őket. Exportáljon Word-kompatibilis RTF-et formázással és képekkel.\nA4-lapok: laponként álló (210 × 297 mm) vagy fekvő (297 × 210 mm) tájolás választható. Egy jegyzethez több lap adható; a listával válthat közöttük. Az összes lap együtt menthető és exportálható; az RTF megőrzi a tájolást és a 20 mm-es margókat. Az írási terület az ablakhoz igazodik.\n\nSÚGÓ, LÁBLÉC ÉS HUMOR\n\nA Help útmutatót és GitHub-/LinkedIn-hivatkozásokat nyit meg. A lábléc gombjával csillagot adhat az NdevTools projektnek a GitHubon. A BIM-humor alapértelmezés szerint bekapcsolt. A kapcsolóval ki- és bekapcsolható; az eszköz megjegyzi a választást. A Next Joke másik viccet mutat.\n\nKOMPATIBILITÁS\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nKészítette: Nataraj Devaraj."
  ja: "NDEV TOOLS | ノート\n\n使用方法\n\nRevit の隣で個人ノートを作成できます。ノートの作成・検索、手動保存・自動保存、テキスト書き出しに対応します。ノートは自分のパソコンに保存されます。\n\n書式と画像\n\nフォント、サイズ、太字・斜体・下線、リスト、配置を設定できます。文字、強調表示、ページの色を選択し、画像の挿入・貼り付け・サイズ変更ができます。書式と画像を含む Word 互換 RTF を書き出せます。\nA4 シート：シートごとに縦（210 × 297 mm）または横（297 × 210 mm）を選べます。1 つのノートに複数のシートを追加し、一覧で切り替えます。全シートをまとめて保存・書き出しでき、RTF は各シートの向きと 20 mm の余白を保持します。編集領域はウィンドウに合わせて広がります。\n\nヘルプ・フッター・ユーモア\n\nHelp で操作説明と GitHub/LinkedIn リンクを開けます。フッターには GitHub の NdevTools にスターを付けるためのボタンがあります。BIM ユーモアは既定でオンです。スイッチでオン・オフを切り替えると、このツールの設定として保存されます。Next Joke で別のジョークを表示します。\n\n互換性\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n作成者：Nataraj Devaraj。"
  ko: "NDEV TOOLS | 메모\n\n사용 방법\n\nRevit 옆에서 개인 메모를 작성합니다. 메모 생성 및 검색, 수동 또는 자동 저장, 텍스트 내보내기를 지원합니다. 메모는 사용자 컴퓨터에 저장됩니다.\n\n서식 및 이미지\n\n글꼴, 크기, 굵게/기울임/밑줄, 목록 및 정렬을 설정합니다. 텍스트, 강조 표시 및 페이지 색상을 지정합니다. 이미지를 삽입하거나 붙여넣고 크기를 조절합니다. 서식과 이미지가 포함된 Word 호환 RTF로 내보냅니다.\nA4 시트: 시트마다 세로(210 × 297 mm) 또는 가로(297 × 210 mm)를 선택합니다. 하나의 메모에 여러 시트를 추가하고 목록에서 전환합니다. 모든 시트를 함께 저장하고 내보내며 RTF는 각 방향과 20 mm 여백을 유지합니다. 작성 영역은 창 크기에 맞춰집니다.\n\n도움말, 바닥글 및 유머\n\nHelp에서 사용 안내와 GitHub/LinkedIn 링크를 엽니다. 바닥글에는 GitHub의 NdevTools에 별표를 주기 위한 버튼이 있습니다. BIM 유머는 기본적으로 켜져 있으며 스위치로 끄거나 켤 수 있습니다. 도구별 선택이 저장됩니다. Next Joke는 다른 농담을 표시합니다.\n\n호환성\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\n제작: Nataraj Devaraj."
  nl_nl: "NDEV TOOLS | NOTITIES\n\nGEBRUIK\n\nMaak persoonlijke notities naast Revit. Maak en doorzoek notities, sla handmatig of automatisch op en exporteer een tekstkopie. Notities worden op uw computer bewaard.\n\nOPMAAK EN AFBEELDINGEN\n\nStel lettertypen, groottes, vet/cursief/onderstrepen, lijsten en uitlijning in. Kies tekst-, markerings- en paginakleuren. Voeg afbeeldingen in of plak ze en pas de grootte aan. Exporteer Word-compatibele RTF met opmaak en afbeeldingen.\nA4-bladen: kies per blad Staand (210 × 297 mm) of Liggend (297 × 210 mm). Voeg meerdere bladen aan één notitie toe en wissel via de lijst. Sla alle bladen samen op en exporteer ze; RTF behoudt de oriëntaties en marges van 20 mm. Het schrijfgebied past zich aan het venster aan.\n\nHELP, VOETTEKST EN HUMOR\n\nHelp opent instructies en GitHub-/LinkedIn-links. De voettekst bevat een knop om NdevTools op GitHub een ster te geven. BIM-humor staat standaard aan; gebruik de schakelaar om dit uit of aan te zetten. De keuze wordt voor dit hulpmiddel bewaard. Next Joke toont een andere grap.\n\nCOMPATIBILITEIT\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nGemaakt door Nataraj Devaraj."
  pl: "NDEV TOOLS | NOTATKI\n\nSPOSÓB UŻYCIA\n\nTwórz osobiste notatki obok Revitu. Dodawaj i wyszukuj notatki, zapisuj ręcznie lub automatycznie i eksportuj kopię tekstową. Notatki są przechowywane na komputerze.\n\nFORMATOWANIE I OBRAZY\n\nUstawiaj czcionki, rozmiary, pogrubienie/kursywę/podkreślenie, listy i wyrównanie. Wybieraj kolory tekstu, wyróżnienia i strony. Wstawiaj lub wklejaj obrazy i zmieniaj ich rozmiar. Eksportuj RTF zgodny z Wordem z formatowaniem i obrazami.\nArkusze A4: dla każdego arkusza wybierz pion (210 × 297 mm) lub poziom (297 × 210 mm). Dodawaj wiele arkuszy do jednej notatki i przełączaj je na liście. Zapisuj i eksportuj wszystkie razem; RTF zachowuje orientacje i marginesy 20 mm. Obszar pisania dopasowuje się do okna.\n\nPOMOC, STOPKA I HUMOR\n\nHelp otwiera instrukcje i łącza GitHub/LinkedIn. Stopka zawiera przycisk umożliwiający przyznanie gwiazdki NdevTools w GitHub. Humor BIM jest domyślnie włączony; przełącznik pozwala go wyłączyć lub włączyć. Wybór jest zapamiętywany dla narzędzia. Next Joke wyświetla kolejny żart.\n\nZGODNOŚĆ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nAutor: Nataraj Devaraj."
  pt_br: "NDEV TOOLS | NOTAS\n\nCOMO USAR\n\nFaça anotações pessoais ao lado do Revit. Crie e pesquise notas, salve manual ou automaticamente e exporte uma cópia de texto. As notas são armazenadas no computador.\n\nFORMATAÇÃO E IMAGENS\n\nAjuste fontes, tamanhos, negrito/itálico/sublinhado, listas e alinhamento. Aplique cores ao texto, realce e página. Insira, cole e redimensione imagens. Exporte RTF compatível com Word com formatação e imagens.\nFolhas A4: escolha Retrato (210 × 297 mm) ou Paisagem (297 × 210 mm) para cada folha. Adicione várias folhas à mesma nota e alterne pela lista. Salve e exporte todas juntas; o RTF mantém as orientações e margens de 20 mm. A área de escrita se ajusta à janela.\n\nAJUDA, RODAPÉ E HUMOR\n\nHelp abre instruções e links do GitHub/LinkedIn. O rodapé oferece um botão para dar uma estrela ao NdevTools no GitHub. O humor BIM fica ativado por padrão; use o interruptor para desativar ou ativar. A escolha é salva para esta ferramenta. Next Joke mostra outra piada.\n\nCOMPATIBILIDADE\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nCriado por Nataraj Devaraj."
  ru: "NDEV TOOLS | ЗАМЕТКИ\n\nПОРЯДОК РАБОТЫ\n\nВедите личные заметки рядом с Revit. Создавайте и ищите заметки, сохраняйте вручную или автоматически и экспортируйте текстовую копию. Заметки хранятся на компьютере.\n\nФОРМАТИРОВАНИЕ И ИЗОБРАЖЕНИЯ\n\nНастраивайте шрифты, размеры, полужирный/курсив/подчёркивание, списки и выравнивание. Выбирайте цвета текста, выделения и страницы. Вставляйте изображения из файлов или буфера и меняйте размер. Экспортируйте RTF для Word с форматированием и изображениями.\nЛисты A4: для каждого листа выберите книжную (210 × 297 mm) или альбомную (297 × 210 mm) ориентацию. Добавляйте несколько листов в одну заметку и переключайте их в списке. Все листы сохраняются и экспортируются вместе; RTF сохраняет ориентации и поля 20 mm. Область ввода подстраивается под окно.\n\nСПРАВКА, НИЖНИЙ КОЛОНТИТУЛ И ЮМОР\n\nHelp открывает инструкции и ссылки GitHub/LinkedIn. В нижнем колонтитуле есть кнопка для добавления звезды NdevTools на GitHub. BIM-юмор включён по умолчанию; переключатель выключает или включает его. Выбор сохраняется для этого инструмента. Next Joke показывает следующую шутку.\n\nСОВМЕСТИМОСТЬ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nАвтор: Nataraj Devaraj."
  uk: "NDEV TOOLS | НОТАТКИ\n\nПОРЯДОК ВИКОРИСТАННЯ\n\nРобіть особисті нотатки поруч із Revit. Створюйте й шукайте нотатки, зберігайте вручну або автоматично та експортуйте текстову копію. Нотатки зберігаються на комп’ютері.\n\nФОРМАТУВАННЯ ТА ЗОБРАЖЕННЯ\n\nНалаштовуйте шрифти, розміри, жирний/курсив/підкреслення, списки й вирівнювання. Вибирайте кольори тексту, виділення та сторінки. Вставляйте зображення з файлів або буфера й змінюйте розмір. Експортуйте RTF для Word із форматуванням і зображеннями.\nАркуші A4: для кожного аркуша виберіть книжкову (210 × 297 mm) або альбомну (297 × 210 mm) орієнтацію. Додавайте кілька аркушів до однієї нотатки й перемикайте їх у списку. Усі аркуші зберігаються та експортуються разом; RTF зберігає орієнтації та поля 20 mm. Область введення підлаштовується під вікно.\n\nДОВІДКА, НИЖНІЙ КОЛОНТИТУЛ І ГУМОР\n\nHelp відкриває інструкції та посилання GitHub/LinkedIn. Нижній колонтитул містить кнопку для додавання зірки NdevTools на GitHub. BIM-гумор типово ввімкнений; перемикач вимикає або вмикає його. Вибір зберігається для цього інструмента. Next Joke показує наступний жарт.\n\nСУМІСНІСТЬ\n\nRevit 2022–2027 | pyRevit | IronPython 2.7\n\nАвтор: Nataraj Devaraj."

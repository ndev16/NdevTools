
title: Auto Detail Generator

tooltip: "Automatically trace 3D Revit model elements to generate 2D construction details in plan and straight section views.\n\nSUPPORTED ELEMENTS\n• Floors\n• Walls\n• Roofs\n• Structural Foundations\n• Structural Framing\n\nFEATURES\n• Assign filled-region types and outline styles by category.\n• Select No Fill and a line style to generate detail lines.\n\nROOFS\n• Place line-based detail components along roof slopes in sections or top-face edges in plans.\n• Curved roof edges are not supported.\n\nFLOORS\n• Place line-based detail components horizontally along traced floor segments, split at openings.\n\nSTRUCTURAL FRAMING\n• Select a loaded detail component or None.\n• Align the component's bounding-box center with the traced framing center.\n• Point-based and line-based detail families are supported.\n\nCMU WALLS\n• Place repeating details horizontally or vertically in sections.\n• Requires an existing repeating-detail instance as a copy template.\n\nLIMITATIONS\n• Plan walls use the main view cut height.\n• Local plan-region cut heights are not applied.\n• Host-model elements only.\n\nCreated by Nataraj Devaraj."

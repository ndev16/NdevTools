
title: Vulcraft Deck Region

tooltip: "Automatically generate a concrete filled region following the actual Vulcraft metal deck profile in Revit section views.\n\nSUPPORTED DECK TYPES\n• Vulcraft 1.5C-36\n• Vulcraft 2C-36\n• Vulcraft 3C-36\n\nFEATURES\n• Generate accurate corrugated deck profiles based on predefined Vulcraft dimensions.\n• Automatically create concrete filled regions above the metal deck profile.\n• Align the generated profile with the actual Revit deck geometry using a manually selected anchor point.\n• Match deck depth, pitch, bottom flat, and top flat dimensions.\n• Support multiple deck gages.\n• Automatically extend and clip the profile to the selected floor boundaries.\n• Select any available Revit filled region type.\n\nHOW TO USE\n1. Open a Revit section view.\n2. Select the structural deck floor.\n3. Choose the Vulcraft deck type and gage.\n4. Pick the LEFT END of a LOWER FLAT on the actual deck profile.\n5. Select the required filled region type.\n6. The tool generates and selects the concrete filled region.\n\nLIMITATIONS\n• Works in straight section views only.\n• Requires a valid structural floor and visible deck geometry.\n• The anchor point must be selected accurately.\n• Generated filled regions are static 2D annotations.\n\nCreated by Nataraj Devaraj."

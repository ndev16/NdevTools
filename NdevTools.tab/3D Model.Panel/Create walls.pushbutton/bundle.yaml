
title: "Wall\nTracing"
author: "Nataraj Devaraj"

tooltip: "NDEV TOOLS | WALL TRACING\n\nCreate structural host-model walls by tracing supported walls from a loaded architectural Revit link.\n\nHOW TO USE\n1. Open a Revit project in a plan or 3D view and click Wall Tracing.\n2. Select a loaded architectural Revit link and one or more source levels.\n3. Map each source level to host bottom and top levels.\n4. Review suggested host Basic Wall types; choose None to skip a source type.\n5. Click Create Walls and review the creation and diagnostic report.\n\nBEHAVIOR\n- Supports straight, vertical Basic Walls with a reliable positive-width structural layer.\n- Uses the thickest Structure [1] layer to align walls.\n- Suggests host Basic Wall types by thickness only; verify type and material suitability.\n- Uses selected host levels and preserves applicable source base/top offsets.\n- Skips duplicate host walls and source types mapped to None.\n- Skips curved, slanted, tapered, attached, or edited-profile walls.\n- Does not perform opening-specific analysis or modifications.\n\nSAFETY\n- Reads linked documents without changing them.\n- Creates walls in the active host model using a transaction group.\n- Rolls back on fatal errors or cancellation.\n- Temporarily disables automatic joins during wall creation and enables them afterward.\n- To allow joins on existing host walls, select those walls and run Wall Tracing again.\n\nCOMPATIBILITY\npyRevit | Revit 2022 or later. Verify results in your Revit environment.\n\nCreated by Nataraj Devaraj."


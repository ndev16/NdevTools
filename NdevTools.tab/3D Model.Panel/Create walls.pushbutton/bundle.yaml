author: Nataraj Devaraj
tooltip:
  en_us: "NDEV TOOLS | WALL TRACING\n\nCreate structural host-model walls by tracing supported walls from a loaded architectural Revit link.\n\nHOW TO USE\n1. Open a Revit project in a plan or 3D view and click Wall Tracing.\n2. Select a loaded architectural Revit link and one or more source levels.\n3. Map each source level to host bottom and top levels.\n4. Review suggested host Basic Wall types; choose None to skip a source type.\n5. Click Create Walls and review the creation and diagnostic report.\n\nBEHAVIOR\n- Supports straight, vertical Basic Walls with a reliable positive-width structural layer.\n- Uses the thickest Structure [1] layer to align walls.\n- Suggests host Basic Wall types by thickness only; verify type and material suitability.\n- Uses selected host levels and preserves applicable source base/top offsets.\n- Skips duplicate host walls and source types mapped to None.\n- Skips curved, slanted, tapered, attached, or edited-profile walls.\n- Does not perform opening-specific analysis or modifications.\n\nSAFETY\n- Reads linked documents without changing them.\n- Creates walls in the active host model using a transaction group.\n- Rolls back on fatal errors or cancellation.\n- Temporarily disables automatic joins during wall creation and enables them afterward.\n- To allow joins on existing host walls, select those walls and run Wall Tracing again.\n\nCOMPATIBILITY\npyRevit | Revit 2022 or later. Verify results in your Revit environment.\n\nCreated by Nataraj Devaraj."
  en_gb: "Create structural host walls from a linked architectural Revit model. Supports straight vertical Basic Walls with structural layers. Map source and host levels, check wall types and review skipped or duplicate walls. Architectural links are read-only; fatal failures roll back.\n\nNdevTools | Smart BIM Tools"
  fr_fr: "Crée des murs porteurs dans le modèle hôte à partir d'un lien Revit architectural. Prend en charge les murs de base droits et verticaux avec couche porteuse. Associez les niveaux et vérifiez les types et exclusions. Le lien reste en lecture seule ; les erreurs fatales annulent les modifications.\n\nNdevTools | Smart BIM Tools"
  de_de: "Erzeugt tragende Wände im Host-Modell aus einem verknüpften Architekturmodell. Unterstützt gerade, senkrechte Basiswände mit tragender Schicht. Quell- und Host-Ebenen zuordnen und Wandtypen sowie Überspringungen prüfen. Verknüpfungen bleiben schreibgeschützt.\n\nNdevTools | Smart BIM Tools"
  it_it: "Crea muri strutturali nel modello host da un modello architettonico collegato. Supporta muri di base rettilinei e verticali con strato strutturale. Associare i livelli, verificare i tipi e gli elementi ignorati. Il collegamento resta in sola lettura; gli errori fatali annullano le modifiche.\n\nNdevTools | Smart BIM Tools"
  es_es: "Crea muros estructurales en el modelo anfitrión desde un vínculo arquitectónico de Revit. Admite muros básicos rectos y verticales con capa estructural. Asigne niveles y revise tipos y elementos omitidos. El vínculo es de solo lectura; los errores graves revierten los cambios.\n\nNdevTools | Smart BIM Tools"
  ar: "أنشئ جدراناً إنشائية في النموذج المضيف اعتماداً على نموذج معماري مرتبط للقراءة فقط. اختر الرابط والمستويات واربطها بمستويات النموذج المضيف، ثم راجع أنواع الجدران واضغط إنشاء. تُدعم الجدران الأساسية المستقيمة الرأسية ذات الطبقة الإنشائية؛ تُتجاوز الأشكال غير المدعومة والمكررة ويمكن التراجع عند فشل خطير. تحقق من المواد والنتائج.\n\nNdevTools | Smart BIM Tools"
  bg: "Създавайте конструктивни стени в основния модел по свързан архитектурен модел само за четене. Изберете връзката и нивата, съпоставете нивата и типовете стени и стартирайте. Поддържат се прави вертикални Basic Walls със структурен слой; неподдържаните и дублираните се пропускат, а сериозна грешка отменя промените. Проверете материалите.\n\nNdevTools | Smart BIM Tools"
  chinese_s: "根据只读建筑 Revit 链接在主体模型中创建结构墙。选择链接和源标高，映射目标标高与墙类型后执行。仅支持带有效结构层的直立直线基本墙；跳过不支持的几何体和重复墙，严重错误时回滚。请核对墙材料和结果。\n\nNdevTools | Smart BIM Tools"
  chinese_t: "依據唯讀的建築 Revit 連結，在主體模型中建立結構牆。選取連結及來源樓層，對應目標樓層與牆類型後執行。僅支援具有有效結構層的直立直線基本牆；會略過不支援及重複的牆，嚴重錯誤時回復變更。請核對材料與結果。\n\nNdevTools | Smart BIM Tools"
  cs: "Vytvářejte nosné stěny v hostitelském modelu z architektonického odkazu pouze pro čtení. Vyberte odkaz a úrovně, namapujte cílové úrovně a typy stěn a spusťte tvorbu. Podporovány jsou rovné svislé základní stěny s nosnou vrstvou; nepodporované a duplicitní se přeskočí, při závažné chybě se změny vrátí. Ověřte materiály.\n\nNdevTools | Smart BIM Tools"
  fa: "از مدل معماری پیوندی فقط‌خواندنی، دیوارهای سازه‌ای در مدل میزبان بسازید. پیوند و ترازها را انتخاب، ترازهای مقصد و نوع دیوار را تعیین و اجرا کنید. فقط دیوارهای پایهٔ صاف و عمودی دارای لایهٔ سازه‌ای پشتیبانی می‌شوند؛ هندسهٔ نامعتبر و موارد تکراری رد شده و خطای جدی بازگردانی می‌شود. مصالح را بررسی کنید.\n\nNdevTools | Smart BIM Tools"
  hu: "Hozzon létre tartószerkezeti falakat a gazdamodellben egy csak olvasható építészeti Revit-hivatkozás alapján. Válassza ki a hivatkozást és szinteket, rendelje hozzá a gazdaszinteket és faltípusokat, majd futtassa. Csak egyenes, függőleges, teherhordó rétegű alapfalak támogatottak; a nem támogatott és ismétlődő falak kimaradnak, súlyos hiba esetén visszaállítás történik. Ellenőrizze az anyagokat.\n\nNdevTools | Smart BIM Tools"
  ja: "読み取り専用の建築 Revit リンクから、ホストモデルに構造壁を作成します。リンクと階層を選び、ホスト階層と壁タイプを割り当てて実行してください。構造レイヤーを持つ直線の垂直基本壁に対応し、非対応形状や重複壁はスキップします。重大なエラー時はロールバックします。材料と結果を確認してください。\n\nNdevTools | Smart BIM Tools"
  ko: "읽기 전용 건축 Revit 링크에서 호스트 모델의 구조 벽을 생성합니다. 링크와 레벨을 선택하고 호스트 레벨과 벽 유형을 매핑한 뒤 실행합니다. 구조 레이어가 있는 직선 수직 기본 벽만 지원하며, 비지원 형상과 중복 벽은 건너뜁니다. 심각한 오류 시 롤백하며 재료를 확인해야 합니다.\n\nNdevTools | Smart BIM Tools"
  nl_nl: "Maak constructieve wanden in het hostmodel op basis van een alleen-lezen architectonische Revit-koppeling. Selecteer koppeling en niveaus, koppel hostniveaus en wandtypen en voer uit. Alleen rechte verticale basiswanden met constructieve laag worden ondersteund; ongeldige en dubbele wanden worden overgeslagen en ernstige fouten teruggedraaid. Controleer de materialen.\n\nNdevTools | Smart BIM Tools"
  pl: "Twórz ściany konstrukcyjne w modelu głównym z architektonicznego łącza Revit tylko do odczytu. Wybierz łącze i poziomy, przypisz docelowe poziomy i typy ścian, a następnie uruchom. Obsługiwane są proste pionowe ściany podstawowe z warstwą konstrukcyjną; nieobsługiwane i zduplikowane są pomijane, a przy poważnym błędzie zmiany są cofane. Sprawdź materiały.\n\nNdevTools | Smart BIM Tools"
  pt_br: "Crie paredes estruturais no modelo hospedeiro a partir de um vínculo arquitetônico somente leitura. Selecione o vínculo e os níveis, mapeie os níveis de destino, confira os tipos de parede e execute. Suporta paredes básicas retas e verticais com camada estrutural; ignora geometrias incompatíveis e duplicatas, com reversão em falhas graves. Verifique os materiais.\n\nNdevTools | Smart BIM Tools"
  ru: "Создавайте несущие стены в основной модели по архитектурной связи Revit только для чтения. Выберите связь и уровни, сопоставьте уровни основной модели и типы стен, затем выполните построение. Поддерживаются только прямые вертикальные базовые стены с несущим слоем; неподдерживаемые и повторяющиеся стены пропускаются, серьёзные ошибки приводят к откату. Проверьте материалы.\n\nNdevTools | Smart BIM Tools"
  uk: "Створюйте несучі стіни в головній моделі за архітектурним зв’язком Revit лише для читання. Виберіть зв’язок і рівні, зіставте рівні та типи стін і виконайте побудову. Підтримуються лише прямі вертикальні базові стіни з несучим шаром; непідтримувані та повторні стіни пропускаються, а серйозні помилки відкотять зміни. Перевірте матеріали.\n\nNdevTools | Smart BIM Tools"

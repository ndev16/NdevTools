title:
  ar: "من CAD إلى المحاور"
  pt_br: "CAD para eixos"
  bg: "От CAD към оси"
  chinese_s: "CAD 转轴网"
  chinese_t: "CAD 轉軸網"
  cs: "CAD na osnovy"
  nl_nl: "CAD naar stramienen"
  en_gb: "CAD to Grids"
  en_us: "CAD to Grids"
  fa: "CAD به محور"
  fr_fr: "CAO vers quadrillages"
  de_de: "CAD zu Rastern"
  hu: "CAD-ből raszterek"
  it_it: "Da CAD a griglie"
  ja: "CAD から通芯"
  ko: "CAD에서 그리드 생성"
  pl: "CAD na osie"
  ru: "Из CAD в оси"
  es_es: "De CAD a rejillas"
  uk: "З CAD в осі"
tooltip:
  ar: "راجع محاور CAD، بما فيها المحاور المائلة، وعدّل الأسماء المقترحة، وأنشئ جميع المحاور المعيّنة معًا."
  pt_br: "Revise os eixos CAD, incluindo eixos inclinados, edite os nomes propostos e crie todos os eixos mapeados de uma só vez."
  bg: "Преглеждайте CAD осите, включително наклонените, редактирайте предложените имена и създавайте всички съпоставени оси наведнъж."
  chinese_s: "检查 CAD 轴网（包括斜向轴网），编辑建议名称，一次创建所有已映射的轴网。"
  chinese_t: "檢查 CAD 軸網（包括斜向軸網），編輯建議名稱，一次建立所有已對應的軸網。"
  cs: "Zkontrolujte CAD osnovy včetně šikmých, upravte navržené názvy a vytvořte všechny přiřazené osnovy najednou."
  nl_nl: "Controleer CAD-stramienen, inclusief schuine stramienen, bewerk de voorgestelde namen en maak alle toegewezen stramienen tegelijk."
  en_gb: "Review CAD grids, including sloped grids, edit proposed names, and create all mapped grids together."
  en_us: "Review CAD grids, including sloped grids, edit proposed names, and create all mapped grids together."
  fa: "محورهای CAD، از جمله محورهای مایل را بررسی کنید، نام‌های پیشنهادی را ویرایش کنید و همه محورهای نگاشت‌شده را هم‌زمان بسازید."
  fr_fr: "Vérifiez les quadrillages CAO, y compris les axes inclinés, modifiez les noms proposés et créez tous les quadrillages associés en une seule fois."
  de_de: "Prüfen Sie CAD-Raster einschließlich schräger Raster, bearbeiten Sie die vorgeschlagenen Namen und erstellen Sie alle zugeordneten Raster gemeinsam."
  hu: "Tekintse át a CAD-rasztereket, köztük a ferde rasztereket, szerkessze a javasolt neveket, és hozza létre az összes hozzárendelt rasztert egyszerre."
  it_it: "Controlla le griglie CAD, comprese quelle inclinate, modifica i nomi proposti e crea tutte le griglie associate in un’unica operazione."
  ja: "斜めの通芯を含む CAD 通芯を確認し、提案された名前を編集して、割り当てたすべての通芯を一括作成します。"
  ko: "기울어진 그리드를 포함한 CAD 그리드를 검토하고 제안된 이름을 편집한 후 매핑된 모든 그리드를 한 번에 생성합니다."
  pl: "Sprawdź osie CAD, w tym osie ukośne, edytuj proponowane nazwy i utwórz wszystkie przypisane osie jednocześnie."
  ru: "Проверьте оси CAD, включая наклонные, отредактируйте предложенные имена и создайте все сопоставленные оси одновременно."
  es_es: "Revisa las rejillas CAD, incluidas las inclinadas, edita los nombres propuestos y crea todas las rejillas asignadas a la vez."
  uk: "Перевіряйте осі CAD, зокрема похилі, редагуйте запропоновані назви та створюйте всі зіставлені осі одночасно."
author: Nataraj Devaraj
min_revit_version: 2023

title:
  ar: "من CAD إلى الجدران"
  pt_br: "CAD para paredes"
  bg: "От CAD към стени"
  chinese_s: "CAD 转墙"
  chinese_t: "CAD 轉牆"
  cs: "CAD na stěny"
  nl_nl: "CAD naar wanden"
  en_gb: "CAD to Walls"
  en_us: "CAD to Walls"
  fa: "CAD به دیوار"
  fr_fr: "CAO vers murs"
  de_de: "CAD zu Wänden"
  hu: "CAD-ből falak"
  it_it: "Da CAD a muri"
  ja: "CAD から壁"
  ko: "CAD에서 벽 생성"
  pl: "CAD na ściany"
  ru: "Из CAD в стены"
  es_es: "De CAD a muros"
  uk: "З CAD у стіни"
tooltip:
  ar: "افحص سماكات جدران CAD تلقائيًا، وعيّن أنواع جدران Revit، وأنشئ الجدران بالمناسيب والإزاحات المختارة. يتضمن فتحات أبواب ونوافذ اختيارية ورسائل واضحة أثناء الفحص والإنشاء."
  pt_br: "Detecte automaticamente as espessuras das paredes CAD, associe tipos de parede do Revit e crie paredes com os níveis e deslocamentos escolhidos. Inclui aberturas opcionais de portas e janelas e mensagens claras durante a análise e a criação."
  bg: "Автоматично откривайте дебелините на CAD стените, задавайте типове стени в Revit и създавайте стени с избраните нива и отмествания. Включва отвори за врати и прозорци по избор и ясни съобщения при анализ и създаване."
  chinese_s: "自动识别 CAD 墙厚，映射 Revit 墙类型，并按所选标高和偏移创建墙。支持可选的门窗洞口，并在扫描和创建过程中显示清晰的状态消息。"
  chinese_t: "自動辨識 CAD 牆厚，對應 Revit 牆類型，並依所選高程和偏移建立牆。支援選用的門窗開口，並在掃描和建立過程中顯示清楚的狀態訊息。"
  cs: "Automaticky zjistěte tloušťky CAD stěn, přiřaďte typy stěn Revitu a vytvořte stěny se zvolenými podlažími a odsazeními. Zahrnuje volitelné dveřní a okenní otvory a přehledné zprávy během analýzy a vytváření."
  nl_nl: "Detecteer automatisch CAD-wanddiktes, wijs Revit-wandtypen toe en plaats wanden met de gekozen niveaus en offsets. Inclusief optionele deur- en raamopeningen en duidelijke meldingen tijdens het scannen en plaatsen."
  en_gb: "Automatically scan CAD wall thicknesses, map Revit wall types, and place walls with chosen levels and offsets. Includes optional door/window openings and clear scanning and placement messages."
  en_us: "Automatically scan CAD wall thicknesses, map Revit wall types, and place walls with chosen levels and offsets. Includes optional door/window openings and clear scanning and placement messages."
  fa: "ضخامت دیوارهای CAD را خودکار شناسایی کنید، تیپ‌های دیوار Revit را نگاشت کنید و دیوارها را با ترازها و آفست‌های انتخاب‌شده بسازید. شامل بازشوهای اختیاری در و پنجره و پیام‌های روشن هنگام بررسی و ساخت است."
  fr_fr: "Détectez automatiquement les épaisseurs des murs CAO, associez les types de murs Revit et créez les murs avec les niveaux et décalages choisis. Inclut des ouvertures de portes et fenêtres facultatives et des messages clairs pendant l’analyse et la création."
  de_de: "Ermitteln Sie automatisch CAD-Wanddicken, ordnen Sie Revit-Wandtypen zu und erstellen Sie Wände mit den gewählten Ebenen und Versätzen. Mit optionalen Tür- und Fensteröffnungen sowie klaren Statusmeldungen beim Analysieren und Erstellen."
  hu: "Automatikusan felismeri a CAD-falvastagságokat, hozzárendeli a Revit-faltípusokat, és a kiválasztott szintekkel és eltolásokkal hozza létre a falakat. Választható ajtó- és ablaknyílásokkal, valamint egyértelmű elemzési és elhelyezési állapotüzenetekkel."
  it_it: "Rileva automaticamente gli spessori dei muri CAD, associa i tipi di muro Revit e crea i muri con i livelli e gli offset scelti. Include aperture opzionali per porte e finestre e messaggi chiari durante l’analisi e la creazione."
  ja: "CAD の壁厚を自動検出し、Revit の壁タイプを割り当て、選択したレベルとオフセットで壁を作成します。ドア・窓の開口部を任意で作成でき、スキャン中と配置中に状態メッセージを表示します。"
  ko: "CAD 벽 두께를 자동으로 감지하고 Revit 벽 유형을 매핑한 뒤 선택한 레벨과 간격띄우기로 벽을 배치합니다. 문과 창 개구부를 선택적으로 생성하며, 스캔 및 배치 중 상태 메시지를 표시합니다."
  pl: "Automatycznie wykrywaj grubości ścian CAD, przypisuj typy ścian Revit i twórz ściany z wybranymi poziomami i odsunięciami. Obejmuje opcjonalne otwory drzwiowe i okienne oraz czytelne komunikaty podczas analizy i tworzenia."
  ru: "Автоматически определяйте толщины стен CAD, сопоставляйте типы стен Revit и создавайте стены с выбранными уровнями и смещениями. Поддерживаются необязательные дверные и оконные проёмы и понятные сообщения во время анализа и создания."
  es_es: "Detecta automáticamente los espesores de los muros CAD, asigna tipos de muro de Revit y crea muros con los niveles y desfases elegidos. Incluye huecos opcionales para puertas y ventanas y mensajes claros durante el análisis y la creación."
  uk: "Автоматично визначайте товщини стін CAD, зіставляйте типи стін Revit та створюйте стіни з вибраними рівнями і зміщеннями. Передбачено необов’язкові дверні й віконні прорізи та зрозумілі повідомлення під час аналізу і створення."
author: Nataraj Devaraj
min_revit_version: 2023
